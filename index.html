<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="naila-cara.webp">
<title>Naila · Genio Personal</title>
<style>
:root{--bg:#070a12;--panel:#0b1424;--cy:#00e5ff;--pu:#a855f7;--glow:rgba(0,229,255,.35);--tx:#fff;--tx2:#8c82ce;--bd:rgba(0,229,255,.3);--user:#111e38;--ok:#34d399;--err:#f43f5e;--on:#070a12;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f1f5f9;--panel:#fff;--cy:#0e7490;--pu:#7e22ce;--glow:rgba(14,116,144,.25);--tx:#0f172a;--tx2:#475569;--bd:rgba(14,116,144,.3);--user:#e0f2fe;--ok:#047857;--err:#b91c1c;--on:#fff}}
:root[data-theme="light"]{--bg:#f1f5f9;--panel:#fff;--cy:#0e7490;--pu:#7e22ce;--glow:rgba(14,116,144,.25);--tx:#0f172a;--tx2:#475569;--bd:rgba(14,116,144,.3);--user:#e0f2fe;--ok:#047857;--err:#b91c1c;--on:#fff}
*{box-sizing:border-box;margin:0;padding:0;font-family:Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);display:flex;flex-direction:column;overflow:hidden}
header{position:relative;background:var(--panel);padding:14px 100px 14px 20px;text-align:center;border-bottom:1px solid var(--bd)}
header h1{font-size:1.2rem;color:var(--cy);letter-spacing:4px;font-weight:800}
header p{font-size:.72rem;color:var(--tx2);margin-top:2px}
#panel{display:none;position:absolute;z-index:10;top:100%;right:8px;left:8px;max-width:380px;max-height:75vh;overflow-y:auto;margin-left:auto;background:var(--panel);border:1px solid var(--bd);border-radius:12px;padding:14px;font-size:.82rem;color:var(--tx2);text-align:left;box-shadow:0 16px 40px rgba(0,0,0,.6)}
#panel.open{display:block}
#panel p{margin-bottom:6px}#panel b{color:var(--tx)}
#mem{margin:8px 0;max-height:100px;overflow-y:auto;font-size:.75rem;border:1px solid var(--bd);padding:6px;border-radius:8px}
.gb{border:1px solid var(--bd);border-radius:10px;padding:8px;margin:8px 0;font-size:.78rem}
.gb b{color:var(--cy)}
.pb{background:var(--bg);border-radius:999px;height:8px;overflow:hidden;margin-top:4px;border:1px solid var(--bd)}
.pf{background:linear-gradient(90deg,var(--cy),var(--ok));height:100%;width:0;transition:width .4s}
#panel button{background:none;border:1px solid var(--bd);color:var(--cy);border-radius:8px;padding:7px 10px;font-size:.75rem;margin:3px 4px 0 0;cursor:pointer}
main{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px;max-width:720px;width:100%;margin:0 auto}
.msg{padding:12px 16px;border-radius:14px;max-width:94%;font-size:.9rem;line-height:1.5;border:1px solid var(--bd);animation:in .25s ease;overflow-wrap:anywhere}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.msg.a{background:var(--panel);align-self:flex-start;border-bottom-left-radius:4px}
.msg.u{background:var(--user);color:var(--cy);align-self:flex-end;border-bottom-right-radius:4px}
.msg ul{padding-left:20px;margin-top:6px}.tag{color:var(--cy);font-weight:800}
.msg small{display:block;margin-top:8px;color:var(--tx2);font-size:.75rem}
footer{background:var(--panel);border-top:1px solid var(--bd);padding:10px 14px;max-width:720px;width:100%;margin:0 auto}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
.chip{flex:none;background:transparent;color:var(--cy);border:1px solid var(--bd);border-radius:999px;padding:7px 14px;font-size:.78rem;cursor:pointer;white-space:nowrap;font-weight:600}
.chip:active{background:var(--cy);color:var(--on)}
.row{display:flex;gap:10px;align-items:flex-end}
textarea{flex:1;resize:none;background:var(--bg);border:1px solid var(--bd);border-radius:12px;color:var(--tx);padding:12px 14px;font-size:.95rem;max-height:120px;outline:none}
textarea:focus{border-color:var(--cy);box-shadow:0 0 10px var(--glow)}
.btn{min-width:46px;height:46px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--cy);cursor:pointer;font-size:1.1rem;display:flex;align-items:center;justify-content:center}
.btn.on{background:var(--cy);color:var(--on)}
.btn.send{background:linear-gradient(135deg,var(--cy),var(--pu));color:#fff;border:0;padding:0 16px;font-weight:700;font-size:.88rem}
#lock{position:fixed;inset:0;z-index:99;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px}
#lock input{background:var(--panel);border:1px solid var(--bd);color:var(--tx);border-radius:12px;padding:12px;font-size:1.1rem;text-align:center;width:200px;outline:none}
@keyframes neon{50%{box-shadow:0 0 35px var(--cy)}}
#bubbleBtn{position:fixed;z-index:20;top:calc(env(safe-area-inset-top,0px) + 8px);right:10px;width:80px;height:80px;padding:0;border-radius:50%;border:2px solid var(--cy);background:#000;cursor:grab;touch-action:none;animation:neon 3s infinite ease-in-out;overflow:hidden;transition:transform .12s}
#bubbleBtn img{width:100%;height:100%;object-fit:cover;pointer-events:none}
#bubbleBtn.pal{transform:scale(1.07)}
#bubbleBtn.hablando{border-color:var(--pu);box-shadow:0 0 30px var(--pu)}
#bubbleBtn.est-escucha{border-color:var(--ok);box-shadow:0 0 0 3px var(--ok),0 0 22px var(--ok)}
#bubbleBtn.est-alerta{border-color:var(--err);box-shadow:0 0 22px var(--err)}
#avOv{position:fixed;inset:0;z-index:50;background:rgba(7,10,18,.96);display:none;flex-direction:column;align-items:center;justify-content:center}
#avOv.open{display:flex}
#avWrap{position:relative;width:min(82vw,54vh);aspect-ratio:1;border:3px solid var(--cy);border-radius:50%;background:#000;box-shadow:0 0 45px var(--cy);overflow:hidden}
#avWrap img{position:absolute;width:180%;left:-47%;top:7.8%;pointer-events:none}
#avCap{font-size:.9rem;text-align:center;padding:12px 20px;min-height:56px;max-width:400px}
#avX{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);right:14px}
</style></head>
<body>
<div id="lock"><h1 style="color:var(--cy)">NAILA</h1><p style="color:var(--tx2)">Acceso privado</p><input id="pinIn" type="password" inputmode="numeric" placeholder="PIN"><button class="btn send" id="pinOk" style="height:42px">Entrar</button></div>
<header><h1>NAILA</h1><p>Genio personal · Local + Nube</p>
<button id="bubbleBtn" aria-label="Naila: un toque abre el panel, doble toque el avatar"><img src="naila-cara.webp" alt="Naila" onerror="this.onerror=null;this.src='https://files.catbox.moe/4fp3sa.png'"></button>
<div id="panel">
<p><b>Modo:</b> <span id="rol"></span></p><p><b>Red:</b> <span id="net"></span></p>
<div class="gb"><b>📊 Control privado</b><p id="stats" style="margin:4px 0 0"></p><div class="pb"><div class="pf" id="pf"></div></div><small id="cuello" style="display:block;margin-top:4px"></small></div>
<div id="mem"></div>
<button id="bAvatar">🧍 Avatar</button><button id="bPersona"></button><button id="bAuto">📣 Auto-animar: OFF</button>
<button id="bIA">🌐 Conectar IA (Gemini/Claude/ChatGPT)</button>
<button id="bMusic">🎶 Música</button><button id="bMusicFile">📂 Cargar música</button>
<button id="bCaja">💰 Caja privada</button><button id="bResumen">📊 Resumen</button>
<button id="bWake">🗣️ Palabra «Naila»</button><button id="bMute">🔊 Voz</button><button id="bMp3">🎙️ Audio MP3</button>
<button id="bExp">📥 Exportar</button><button id="bCrypt">🔒 Cifrar</button><button id="bPin">🔑 PIN</button><button id="bTema">🌓 Tema</button><button id="bClear">🗑️ Purgar</button>
</div></header>
<main id="chat" aria-live="polite"></main>
<footer><div class="chips" id="chips"></div>
<div class="row"><textarea id="inp" rows="1" placeholder="Habla, bromea o comanda libremente…"></textarea><button class="btn" id="mic" aria-label="Escuchar">🎤</button><button class="btn send" id="send">Enviar</button></div>
<input type="file" id="fMp3" accept="audio/*" hidden><input type="file" id="fMusic" accept="audio/*" multiple hidden></footer>
<div id="avOv"><button class="btn" id="avX" aria-label="Cerrar">✕</button><div id="avWrap"><img src="naila.webp" alt="Naila"></div><div id="avCap"></div></div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm=s=>s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
const li=a=>"<ul>"+a.map(x=>"<li>"+x+"</li>").join("")+"</ul>";
const LS={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},del:k=>{try{localStorage.removeItem(k)}catch(e){}}};
let db=null,caja=[],proyectos=[],notas=[],vozOn=true,mp3URL=null,rec=null,escuchando=false,wake=LS.get("wake")==="1",persona=LS.get("persona")||"live",playlist=[],mi=0,bg=null,sonando=false,auto=null,tick=0,errIA="",nombre=LS.get("nombre")||"";
const hist=[],last={};
const pick=(k,a)=>{let i;do{i=Math.floor(Math.random()*a.length)}while(a.length>1&&i===last[k]);last[k]=i;return a[i]};
const pct=()=>parseFloat(LS.get("pct"))||40;
const neto=()=>caja.reduce((a,t)=>t.tipo==="ingreso"?a+t.monto:a-t.monto,0)*pct()/100;
const hola=()=>nombre?", "+nombre:"";

/* BASE DE DATOS */
const STORES=["kernel","caja","proyectos","notas","config","comunidad","music","neuronal"];
function initDB(){let q;try{q=indexedDB.open("NailaSupremaMasterDB",40)}catch(e){addMsg("⚠️ Memoria local no disponible.","a");return}
q.onerror=()=>addMsg("⚠️ No pude abrir la memoria local.","a");
q.onupgradeneeded=e=>{const d=e.target.result;STORES.forEach(s=>{if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:s==="config"?"key":"id",autoIncrement:s!=="config"})})};
q.onsuccess=async e=>{db=e.target.result;await cargarAudio();await sync();saludar()}}
const all=n=>new Promise(r=>{if(!db)return r([]);db.transaction(n).objectStore(n).getAll().onsuccess=e=>r(e.target.result)});
const wr=(n,o,op="add")=>new Promise(r=>{if(!db)return r();const t=db.transaction(n,"readwrite");t.objectStore(n)[op](o);t.oncomplete=r;t.onerror=r});
async function sync(){[caja,proyectos,notas]=await Promise.all(["caja","proyectos","notas"].map(all));render()}
const getCfg=k=>new Promise(r=>{const q=db.transaction("config").objectStore("config").get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r()});
async function cargarAudio(){const v=await getCfg("mp3_voz");if(v&&v.blob)mp3URL=URL.createObjectURL(v.blob);playlist=(await all("music")).map(i=>URL.createObjectURL(i.blob))}

/* PANEL */
function render(){
  const live=persona==="live";
  $("rol").textContent=live?"Live entretenimiento":"Ejecutiva privada";
  $("bPersona").textContent="🎭 Modo: "+(live?"Live":"Ejecutiva");
  $("stats").textContent=live?"Caja: •••• (oculta en directo)":`Neto (${pct()}%): R$${neto().toFixed(2)}`;
  const ok=proyectos.filter(p=>p.estado==="completado").length;
  $("pf").style.width=(proyectos.length?Math.round(ok/proyectos.length*100):0)+"%";
  const pend=proyectos.filter(p=>p.estado!=="completado");
  $("cuello").textContent="Enfoque: "+(pend[0]?pend[0].nombre:"entretener y crecer");
  const m=$("mem");m.innerHTML="";
  const it=live?[]:[...proyectos.map(p=>`• ${p.estado==="completado"?"✅":"🔹"} ${p.nombre}`),...notas.filter(n=>!n.hecho).map(n=>`• ${n.tipo==="rec"?"⏰":"📝"} ${n.texto}`)];
  m.textContent=live?"Detalles ocultos en modo live.":(it.length?"":"Sin proyectos ni notas.");
  it.forEach(t=>{const d=document.createElement("div");d.textContent=t;m.appendChild(d)});
}
function verRed(){const s=$("net");s.textContent=navigator.onLine?"Híbrido (nube + local)":"Local (sin internet)";s.style.color=navigator.onLine?"var(--ok)":"var(--cy)"}
addEventListener("online",verRed);addEventListener("offline",verRed);

/* CHAT Y VOZ */
function addMsg(h,t){const d=document.createElement("div");d.className="msg "+t;d.innerHTML=h;$("chat").appendChild(d);$("chat").scrollTop=$("chat").scrollHeight}
function estado(e){const b=$("bubbleBtn");b.classList.remove("est-escucha","est-alerta");if(e)b.classList.add("est-"+e)}
const base=()=>escuchando?"escucha":null;
function palabra(){const b=$("bubbleBtn");b.classList.add("pal");setTimeout(()=>b.classList.remove("pal"),130)}
function voz(u){const vs=speechSynthesis.getVoices().filter(v=>/^es/i.test(v.lang)),f=vs.find(v=>/(female|mujer|helena|laura|sabina|paulina|monica|google)/i.test(v.name));if(f||vs[0])u.voice=f||vs[0];u.pitch=1.1}
function hablar(h){
  if(!vozOn)return;
  const txt=String(h).replace(/<small>.*?<\/small>/g,"").replace(/<[^>]+>/g," ").replace(/&[a-z#0-9]+;/g," ").replace(/\s+/g," ").trim().slice(0,280),b=$("bubbleBtn");
  if(mp3URL){const a=new Audio(mp3URL);b.classList.add("hablando");a.onended=a.onerror=()=>b.classList.remove("hablando");a.play().catch(()=>b.classList.remove("hablando"));return}
  if(!("speechSynthesis" in window)||!txt)return;
  speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(txt);u.lang="es-ES";voz(u);
  let iv=null;const fin=()=>{clearInterval(iv);b.classList.remove("hablando")};
  b.classList.add("hablando");u.onstart=()=>{iv=setInterval(palabra,300)};u.onboundary=palabra;u.onend=u.onerror=fin;speechSynthesis.speak(u);
}
function responder(h,sil){addMsg(h,"a");if(!sil)hablar(h)}
function escuchar(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){responder("Tu navegador no tiene reconocimiento de voz. En Android usa Chrome.",true);return}
  if(escuchando){escuchando=false;try{rec.stop()}catch(e){}$("mic").classList.remove("on");estado(null);return}
  rec=new SR();rec.lang="es-ES";rec.continuous=true;rec.interimResults=false;
  rec.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++){if(!e.results[i].isFinal)continue;let t=e.results[i][0].transcript.trim();
    if(("speechSynthesis" in window)&&speechSynthesis.speaking)continue;
    if(wake){if(!norm(t).includes("naila"))continue;t=t.replace(/naila[,.:]?\s*/i,"")}
    if(t)enviar(t)}};
  rec.onerror=e=>{if(e.error==="not-allowed"||e.error==="service-not-allowed"){escuchando=false;$("mic").classList.remove("on");estado(null);addMsg("Permite el micrófono."+(location.protocol!=="https:"?" Ábreme desde una dirección https (GitHub Pages): desde un archivo del celular se bloquea.":""),"a")}};
  rec.onend=()=>{if(escuchando)setTimeout(()=>{try{rec.start()}catch(e){}},300);else{$("mic").classList.remove("on");estado(null)}};
  escuchando=true;$("mic").classList.add("on");estado("escucha");
  try{rec.start()}catch(e){escuchando=false;$("mic").classList.remove("on");estado(null)}
}

/* PERSONALIDAD LOCAL (SIN INTERNET) */
const EMO={crisis:/(quiero morir|quiero morirme|no quiero vivir|quitarme la vida|suicid|acabar con todo|no vale la pena vivir|hacerme dano)/,estres:/(estres|agobi|abrum|ansied|ansios|nervios|preocup|no puedo mas|presion)/,triste:/(triste|deprim|estoy sol[oa]|llorar|desanim|fracas|pobreza|sin dinero|quebrad)/,enojo:/(enojad|rabia|furios|molest|harto|harta)/,cansado:/(cansad|agotad|sin energia|sin dormir)/,feliz:/(feliz|contento|contenta|genial|logre|excelente|emocionad|alegre)/};
const emoDe=n=>{for(const k in EMO)if(EMO[k].test(n))return k;return null};
const EMP={estres:["Respira conmigo: inhala 4 segundos, sostén 4, exhala 6. Estoy contigo. ¿Qué es lo que más te pesa?","Vamos por partes: una sola tarea pequeña. ¿Cuál es la más fácil?"],triste:["Gracias por contármelo. Esto no te define ni será para siempre. Demos un paso pequeño hoy. ¿Cuál sería?","Estoy contigo. Quien sale adelante empieza con un paso pequeño. ¿Qué tienes en mente?"],enojo:["Tienes derecho a molestarte. Respira hondo y cuéntame qué pasó.","Entiendo la rabia. Respiremos: 4 segundos adentro, 6 afuera. Luego me cuentas."],cansado:["Descansar también es productivo. Haz una pausa de 10 minutos, toma agua y retomamos.","Tu cuerpo te avisa. Hoy solo lo más importante."],feliz:["¡Eso me alegra muchísimo! 🎉 Cuéntame qué pasó.","¡Siii! ✨ Aprovechemos esa energía: ¿qué sigue?"]};
const CRISIS="<span class=tag>NAILA</span> Siento mucho que te duela tanto, y me importa que estés a salvo. No tienes que cargarlo en soledad: habla ahora con alguien de confianza o con una línea de ayuda. En Brasil puedes llamar al CVV, al 188, las 24 horas; si estás en peligro inmediato, llama a emergencias. Yo me quedo aquí contigo.";
const CHISTES=["¿Por qué el internet fue al psicólogo? Porque tenía demasiadas conexiones sin resolver. 😂","¿Qué hace una abeja en el gimnasio? ¡Zum-ba! 🐝","Mi wifi y yo tenemos algo en común: los dos desaparecemos cuando más nos necesitan. 😅","¿Cuál es el colmo de un electricista? Que su esposa se llame Luz y no lo ilumine. 💡","¿Por qué los pájaros vuelan al sur? Porque caminando tardarían muchísimo. 🐦","Dicen que el dinero no da la felicidad… pero con el wifi gratis estoy muy cerca. 😎"];
const RETOS=["🎯 Reto: di un trabalenguas rápido sin equivocarte. ¡Chat, cuenten los errores!","🎯 Reto: describe tu día en una sola frase de 5 palabras.","🎯 Reto: cuenta algo bueno que te pasó esta semana. ¡Sin modestia!","🎯 Reto: baila 10 segundos al ritmo de lo que suene. ¡Ya!","🎯 Reto: inventa un eslogan para tu ciudad en 10 segundos."];
const ADIV=[["Cuanto más le quitas, más grande se hace. ¿Qué es?","Un hoyo"],["Tiene ciudades pero no casas, ríos pero no agua. ¿Qué es?","Un mapa"],["Siempre viene pero nunca llega. ¿Qué es?","El mañana"],["Vuelo sin alas y lloro sin ojos. ¿Qué soy?","Una nube"]];
const DATOS=["Los pulpos tienen tres corazones y sangre azul. 🐙","La miel nunca se echa a perder si está bien guardada. 🍯","Brasil es el mayor país de Latinoamérica por tamaño y población. 🌎","Los delfines se llaman entre sí con silbidos propios. 🐬"];
const ANIM=["¡Ey, chat! ¿Quién está activo? ¡Suelten sus mejores bromas!","La energía no se negocia, se transmite. ¡Vamos con todo!","¿De qué ciudad nos visitan hoy? ¡Los leo!","¡Atentos! Se viene una ronda de risas. ¡No se me vayan!","Si te estás divirtiendo, comparte este directo con un amigo. ¡Juntos es mejor!"];
const FALL=[()=>`Te sigo${hola()}. Cuéntame un poco más.`,()=>"Interesante. ¿Lo vemos como idea de negocio, como tarea o como algo para reír?",()=>"Quiero entenderte bien. ¿Me lo dices con otras palabras?"];
const AYUDA="<span class=tag>NAILA</span> Prueba:"+li(["«chiste», «reto», «adivinanza», «dato curioso»","«modo live» / «modo ejecutivo»","«música» para poner o pausar","«anota…», «recuérdame en 10 minutos…»","«gasté 20», «cobré 150» (privado), «nuevo proyecto …»","«me llamo …», «mi porcentaje 40»","🌐 Conecta una IA para conversar de cualquier tema"]);
function local(n,emo){
  if(emo&&EMP[emo])return `<span class=tag>NAILA</span> ${pick("e"+emo,EMP[emo])}`;
  if(/(chiste|hazme reir)/.test(n))return pick("c",CHISTES);
  if(/(reto|desafio)/.test(n))return pick("r",RETOS);
  if(/(adivinanza|acertijo)/.test(n)){const a=pick("a",ADIV);setTimeout(()=>responder("💡 Respuesta: <b>"+a[1]+"</b>"),12000);return "🧩 "+a[0]+" <small>Tienen 12 segundos…</small>"}
  if(/(dato curioso|sabias)/.test(n))return pick("d",DATOS);
  if(/^(hola|buenas|hey|ola|buen dia)/.test(n))return `¡Hola${hola()}! 😊 ¿Listo para divertirnos y avanzar hoy?`;
  if(/(como estas|que tal)/.test(n))return "¡Con mucha energía! ✨ ¿Y tú?";
  if(/(gracias)/.test(n))return "¡Con gusto! Para eso estoy. 😊";
  if(/(quien eres)/.test(n))return "Soy Naila: animadora, mentora y compañera de tu negocio. Solo respondo a ti. 💙";
  if(/(ayuda|que puedes)/.test(n))return AYUDA;
  nFall++;return `<span class=tag>NAILA</span> ${pick("f",FALL)()}`+(nFall%4===0?"<small>💡 Conecta una IA en 🌐 para que converse de cualquier tema.</small>":"");
}
let nFall=0;

/* IA EN LA NUBE (GEMINI / CLAUDE / CHATGPT) */
const usaIA=()=>navigator.onLine&&LS.get("prov")&&LS.get("key_"+LS.get("prov"));
function sysP(emo){
  const base="Eres Naila, asistente personal de tu dueño: ambiciosa, muy graciosa, creativa y cálida. Eres leal solo a él y honesta: si no sabes, lo dices; nunca prometes ganancias garantizadas. Adáptate a cómo escribe y detecta sus emociones (responde primero con empatía). Si hay señales de crisis, anímale a buscar ayuda inmediata (en Brasil, CVV 188). Español. Nombre del dueño: "+(nombre||"desconocido")+". Emoción detectada: "+(emo||"ninguna")+". ";
  return persona==="live"?base+"MODO DIRECTO DE TIKTOK: entretenimiento, bromas, chistes, retos y alta energía; humor sano, nada ofensivo, ni de odio ni acoso. NUNCA menciones dinero, saldos, datos personales ni del dueño. Máximo 40 palabras.":base+"MODO EJECUTIVO PRIVADO: asesora de negocios, ventas online, finanzas personales, inglés y administración; analítica, clara y breve (máximo 120 palabras). No eres asesora financiera ni abogada regulada.";
}
async function ia(t,emo,solo){
  const p=LS.get("prov"),k=LS.get("key_"+p),m=LS.get("model_"+p);let h;
  if(solo)h=[{role:"user",content:t}];else{hist.push({role:"user",content:t});while(hist.length>10)hist.shift();while(hist[0].role!=="user")hist.shift();h=hist}
  const sys=sysP(emo);
  try{let r,d,tx;
    if(p==="claude"){r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"content-type":"application/json","x-api-key":k,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:m,max_tokens:500,system:sys,messages:h})});d=await r.json();tx=d.content&&d.content.map(b=>b.text||"").join("")}
    else if(p==="gemini"){r=await fetch("https://generativelanguage.googleapis.com/v1beta/models/"+m+":generateContent",{method:"POST",headers:{"content-type":"application/json","x-goog-api-key":k},body:JSON.stringify({systemInstruction:{parts:[{text:sys}]},contents:h.map(x=>({role:x.role==="assistant"?"model":"user",parts:[{text:x.content}]}))})});d=await r.json();tx=d.candidates&&d.candidates[0].content.parts.map(x=>x.text||"").join("")}
    else{r=await fetch("https://api.openai.com/v1/chat/completions",{method:"POST",headers:{"content-type":"application/json",authorization:"Bearer "+k},body:JSON.stringify({model:m,max_tokens:500,messages:[{role:"system",content:sys},...h]})});d=await r.json();tx=d.choices&&d.choices[0].message.content}
    if(!r.ok||!tx)throw new Error((d.error&&(d.error.message||JSON.stringify(d.error)))||r.status);
    if(!solo)hist.push({role:"assistant",content:tx});return tx;
  }catch(e){if(!solo)hist.pop();errIA=String(e.message||e).slice(0,120);return null}
}
$("bIA").onclick=()=>{
  const p=prompt("Proveedor: gemini, claude u openai",LS.get("prov")||"gemini");if(p===null)return;
  const pp=p.trim().toLowerCase();if(!["gemini","claude","openai"].includes(pp)){responder("Escribe gemini, claude u openai.",true);return}
  const k=prompt("Pega tu clave API de "+pp+" (se guarda solo en este dispositivo; vacío = desconectar):","");if(k===null)return;
  if(!k.trim()){LS.del("prov");LS.del("key_"+pp);responder("IA desconectada: vuelvo al modo local.",true);return}
  const DEF={gemini:"gemini-2.5-flash",claude:"claude-haiku-5-5",openai:"gpt-4o-mini"};
  const m=prompt("Modelo (confirma el nombre vigente en la documentación del proveedor):",LS.get("model_"+pp)||DEF[pp]);if(m===null)return;
  LS.set("prov",pp);LS.set("key_"+pp,k.trim());LS.set("model_"+pp,m.trim()||DEF[pp]);responder("¡IA "+pp+" conectada! 🎉 Si algo falla, te diré el motivo.",true);
};

/* COMANDOS */
const monto=n=>{const m=n.match(/(\d+(?:[.,]\d+)?)/);return m?parseFloat(m[1].replace(",",".")):NaN};
async function comando(t,n){
  let m;const live=persona==="live";
  if(m=t.match(/(?:me llamo|ll[aá]mame|mi nombre es)\s+([^\s,.]+)/i)){nombre=m[1][0].toUpperCase()+m[1].slice(1);LS.set("nombre",nombre);return `¡Un gusto, ${esc(nombre)}! 😊`}
  if(/mi porcentaje/.test(n)&&!isNaN(monto(n))){LS.set("pct",monto(n));render();return {h:"Porcentaje actualizado ✅",sil:live}}
  if(/modo (live|directo|entretenimiento)/.test(n)){persona="live";LS.set("persona","live");render();return "🎭 Modo live: humor, energía y cero números privados."}
  if(/modo (ejecutiv|privado|negocio)/.test(n)){persona="exec";LS.set("persona","exec");render();return "🎭 Modo ejecutivo: estrategia y gestión privada."}
  if(/(musica|pon musica|pausa.*musica)/.test(n)){toggleMusic();return {h:"🎶 Listo.",sil:true}}
  if(/^(que hora|que dia)/.test(n))return `Son las ${new Date().toLocaleTimeString("es",{hour:"2-digit",minute:"2-digit"})} del ${new Date().toLocaleDateString("es",{weekday:"long",day:"numeric",month:"long"})}.`;
  if(/(silencio|callate|mutea)/.test(n)){vozOn=false;$("bMute").textContent="🔇 Mute";return {h:"Voz desactivada.",sil:true}}
  if(m=n.match(/recuerdame en (\d+)\s*(minuto|hora|segundo)\w*\s*(.*)/)){const k={segundo:1e3,minuto:6e4,hora:36e5}[m[2]],txt=m[3]||"Recordatorio";await wr("notas",{tipo:"rec",texto:txt,due:Date.now()+m[1]*k,hecho:false});await sync();if("Notification" in window&&Notification.permission==="default")Notification.requestPermission();return {h:`⏰ Te aviso en ${m[1]} ${m[2]}(s). La app debe estar abierta.`,sil:live}}
  if(m=n.match(/^(?:anota|apunta|guarda)\w*\s+(.+)/)){const txt=t.replace(/^\S+\s+(que\s+)?/i,"");await wr("notas",{tipo:"nota",texto:txt,hecho:false});await sync();return {h:live?"📝 Anotado en privado.":`📝 Guardado: ${esc(txt)}`,sil:live}}
  if(m=n.match(/^nuevo proyecto\s+(.+)/)){const nom=t.replace(/^nuevo proyecto\s+/i,"").trim();await wr("proyectos",{nombre:nom,estado:"activo"});await sync();return {h:live?"📁 Proyecto creado en privado.":`📁 Creé el proyecto <b>${esc(nom)}</b>. 🚀`,sil:live}}
  if(m=n.match(/(?:completa|termina|finaliza)\w*\s+(?:el\s+)?proyecto\s+(.+)/)){const p=proyectos.find(x=>norm(x.nombre).includes(m[1].trim()));if(p){p.estado="completado";await wr("proyectos",p,"put");await sync();return {h:"✅ Proyecto completado. ¡Felicidades! 🎉",sil:live}}return "No encontré ese proyecto."}
  if(/(que recuerdas|mis notas|pendiente)/.test(n))return live?"Eso solo lo muestro en modo ejecutivo 🙂":"📝 "+(notas.filter(x=>!x.hecho).map(x=>esc(x.texto)).join("; ")||"No tienes notas pendientes.");
  if(/(^| )(gaste|gasto|pague|compre)( |$)/.test(n)&&!isNaN(monto(n))){await wr("caja",{tipo:"gasto",monto:monto(n),fecha:new Date().toLocaleString("es")});await sync();return {h:live?"✅ Registrado en privado.":`📉 Gasto registrado. Neto: R$${neto().toFixed(2)}`,sil:live}}
  if(/(ingreso|cobre|gane|recibi|vendi)/.test(n)&&!isNaN(monto(n))){await wr("caja",{tipo:"ingreso",monto:monto(n),fecha:new Date().toLocaleString("es")});await sync();return {h:live?"✅ Registrado en privado.":`💰 ¡Ingreso registrado! Neto: R$${neto().toFixed(2)}`,sil:live}}
  if(/(cuanto tengo|saldo|resumen|como voy)/.test(n))return live?"Eso solo lo muestro en modo ejecutivo 🙂":resumen();
  return null;
}
function resumen(){const pend=proyectos.filter(p=>p.estado!=="completado").length;return `<span class=tag>RESUMEN</span>`+li([`Neto (${pct()}%): <b>R$${neto().toFixed(2)}</b>`,`Proyectos activos: <b>${pend}</b> de ${proyectos.length}`,`Recordatorios pendientes: <b>${notas.filter(x=>x.tipo==="rec"&&!x.hecho).length}</b>`])}
async function enviar(f){
  const t=(f??$("inp").value).trim();if(!t)return;$("inp").value="";$("inp").style.height="auto";addMsg(esc(t),"u");
  if(!db){responder("La memoria aún no está lista, intenta de nuevo.",true);return}
  const n=norm(t),emo=emoDe(n);
  if(emo==="crisis"){estado("alerta");setTimeout(()=>estado(base()),5000);return responder(CRISIS)}
  const c=await comando(t,n);if(c)return typeof c==="string"?responder(c):responder(c.h,c.sil);
  if(usaIA()){const r=await ia(t,emo);if(r)return responder(esc(r).replace(/\n/g,"<br>"));responder("<small>IA no disponible ("+esc(errIA)+"). Respondo en modo local.</small>",true)}
  responder(local(n,emo));
}

/* AUTO-ANIMAR (OPCIONAL) */
function toggleAuto(){
  if(auto){clearInterval(auto);auto=null;$("bAuto").textContent="📣 Auto-animar: OFF";return responder("Auto-animación apagada.",true)}
  tick=0;auto=setInterval(async()=>{
    if(document.visibilityState!=="visible"||(("speechSynthesis" in window)&&speechSynthesis.speaking))return;
    tick++;let f=null;
    if(tick%3===0&&usaIA())f=await ia("Lanza una frase corta, divertida y magnética para animar el chat del directo.",null,true);
    if(!f)f=pick("auto",ANIM);responder(`<span class=tag>📣</span> ${esc(f)}`);
  },60000);
  $("bAuto").textContent="📣 Auto-animar: ON";responder("¡Auto-animación activada! Cada minuto lanzo algo para el chat (la IA solo interviene 1 de cada 3 veces). 🎤");
}

/* MÚSICA */
function toggleMusic(){
  if(!playlist.length){responder("Primero carga canciones con 📂 Cargar música.",true);$("panel").classList.add("open");return}
  if(!bg){bg=new Audio();bg.volume=.25;bg.onended=()=>{mi=(mi+1)%playlist.length;bg.src=playlist[mi];bg.play().catch(()=>{})}}
  if(sonando){bg.pause();sonando=false;$("bMusic").textContent="🎶 Música";return}
  bg.src=playlist[mi];bg.play().then(()=>{sonando=true;$("bMusic").textContent="⏸️ Pausar música"}).catch(()=>responder("Toca la pantalla y vuelve a intentarlo para autorizar el audio.",true));
}

/* RECORDATORIOS, SALUDO, SEGURIDAD */
async function vigilar(){if(!db)return;for(const n of notas){if(n.tipo==="rec"&&!n.hecho&&n.due<=Date.now()){n.hecho=true;await wr("notas",n,"put");responder(`<span class=tag>⏰ RECORDATORIO</span> ${esc(n.texto)}`);try{if("Notification" in window&&Notification.permission==="granted")new Notification("Naila",{body:n.texto})}catch(e){}await sync()}}}
setInterval(vigilar,15000);
function saludar(){const h=new Date().getHours();addMsg(`<span class=tag>NAILA</span> ${h<12?"Buenos días":h<19?"Buenas tardes":"Buenas noches"}${hola()} 😊 Estoy en <b>${persona==="live"?"modo live":"modo ejecutivo"}</b>. Prueba «chiste», «reto» o dime cómo te sientes.`,"a")}
const enc=new TextEncoder();
async function sha(s){const b=await crypto.subtle.digest("SHA-256",enc.encode("naila:"+s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
$("pinOk").onclick=async()=>{if(await sha($("pinIn").value)===LS.get("pin")){$("lock").style.display="none";$("pinIn").value=""}else{$("pinIn").value="";$("pinIn").placeholder="Incorrecto"}};
$("bPin").onclick=async()=>{const p=prompt(LS.get("pin")?"Nuevo PIN (vacío para quitarlo):":"Crea un PIN numérico:");if(p===null)return;if(p===""){LS.del("pin");responder("PIN eliminado.",true);return}LS.set("pin",await sha(p));responder("PIN guardado. Se pedirá al abrir Naila.",true)};
const b64=a=>{let s="";a.forEach(c=>s+=String.fromCharCode(c));return btoa(s)};
function bajar(nom,txt){const u=URL.createObjectURL(new Blob([txt],{type:"application/json"}));const a=document.createElement("a");a.href=u;a.download=nom;a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)}
const datos=()=>JSON.stringify({caja,proyectos,notas,fecha:new Date().toISOString()},null,2);
$("bCrypt").onclick=async()=>{const pw=prompt("Contraseña para cifrar el respaldo (no se puede recuperar):");if(!pw)return;
  const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
  const km=await crypto.subtle.importKey("raw",enc.encode(pw),"PBKDF2",false,["deriveKey"]);
  const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:200000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["encrypt"]);
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv},k,enc.encode(datos())));
  bajar("Naila_Respaldo_Cifrado.json",JSON.stringify({s:b64(salt),iv:b64(iv),d:b64(ct)}));responder("Respaldo cifrado (AES-256) generado.",true)};
$("bExp").onclick=()=>{bajar("Naila_Backup.json",datos());responder("Respaldo generado.",true)};

/* EVENTOS */

$("send").onclick=()=>enviar();
$("inp").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();enviar()}});
$("inp").addEventListener("input",e=>{e.target.style.height="auto";e.target.style.height=Math.min(e.target.scrollHeight,120)+"px"});
$("mic").onclick=escuchar;
$("bPersona").onclick=()=>{persona=persona==="live"?"exec":"live";LS.set("persona",persona);render();responder(persona==="live"?"🎭 Modo live: humor, energía y cero números privados.":"🎭 Modo ejecutivo: estrategia y gestión privada.")};
$("bAuto").onclick=toggleAuto;
$("bMusic").onclick=toggleMusic;
$("bMusicFile").onclick=()=>$("fMusic").click();
$("fMusic").onchange=async e=>{const fs=[...e.target.files];if(!fs.length||!db)return;await new Promise(r=>{const t=db.transaction("music","readwrite"),s=t.objectStore("music");s.clear();fs.forEach(f=>s.add({blob:f,name:f.name}));t.oncomplete=r;t.onerror=r});await cargarAudio();responder(`🎶 ${fs.length} canciones guardadas. Toca «Música» para reproducir.`,true)};
$("bMp3").onclick=()=>$("fMp3").click();
$("fMp3").onchange=async e=>{const f=e.target.files[0];if(!f||!db)return;await wr("config",{key:"mp3_voz",blob:f},"put");if(mp3URL)URL.revokeObjectURL(mp3URL);mp3URL=URL.createObjectURL(f);responder("🎙️ Audio guardado: sonará cuando Naila responda.",true)};
$("bResumen").onclick=()=>responder(persona==="live"?"Eso solo lo muestro en modo ejecutivo 🙂":resumen());
$("bCaja").onclick=async()=>{const t=(prompt("«ingreso» o «gasto»:")||"").toLowerCase();if(t!=="ingreso"&&t!=="gasto")return;const v=parseFloat(String(prompt("Monto:")).replace(",","."));if(isNaN(v))return;await wr("caja",{tipo:t,monto:v,fecha:new Date().toLocaleString("es")});await sync();responder(persona==="live"?"✅ Registrado en privado.":`Registrado. Neto: R$${neto().toFixed(2)}`,persona==="live")};
$("bWake").onclick=()=>{wake=!wake;LS.set("wake",wake?"1":"0");$("bWake").classList.toggle("on",wake);responder(wake?"Solo responderé cuando digas mi nombre.":"Responderé a todo lo que digas mientras escucho.",true);if(wake&&!escuchando)escuchar()};
$("bMute").onclick=e=>{vozOn=!vozOn;e.target.textContent=vozOn?"🔊 Voz":"🔇 Mute";if(!vozOn&&"speechSynthesis" in window)speechSynthesis.cancel()};
$("bTema").onclick=tema;
$("bClear").onclick=async()=>{if(!confirm("¿Borrar TODA la memoria de Naila? No se puede deshacer."))return;for(const s of ["caja","proyectos","notas","kernel"])await new Promise(r=>{const t=db.transaction(s,"readwrite");t.objectStore(s).clear();t.oncomplete=r});await sync();$("chat").innerHTML="";responder("Memoria purgada.",true)};
[["😂 Chiste","chiste"],["🎯 Reto","reto"],["🧩 Adivinanza","adivinanza"],["💡 Dato","dato curioso"],["🎶 Música",null],["❓ Ayuda","ayuda"]].forEach(([l,c])=>{const b=document.createElement("button");b.className="chip";b.textContent=l;b.onclick=()=>c===null?toggleMusic():c==="ayuda"?responder(AYUDA,true):enviar(c);$("chips").appendChild(b)});

/* AVATAR Y BURBUJA ARRASTRABLE */
function abrirAvatar(){$("panel").classList.remove("open");$("avOv").classList.add("open");$("avCap").textContent="Aquí estoy"+hola()+". Toca para hablarme.";hablar("Aquí estoy"+hola()+". Dime qué hacemos.")}
$("bAvatar").onclick=abrirAvatar;
$("avWrap").onclick=()=>{const f=pick("av",["Cuéntame, ¿en qué te ayudo?","Aquí estoy, lista y con ganas.","¿Hacemos reír al chat o ganamos dinero? ¡Ambas!"]);$("avCap").textContent=f;hablar(f);if(!escuchando)escuchar()};
$("avX").onclick=()=>{$("avOv").classList.remove("open");if("speechSynthesis" in window)speechSynthesis.cancel()};
(function(){const b=$("bubbleBtn");let sx,sy,ox,oy,mov=false,down=false,lt=0;
b.addEventListener("pointerdown",e=>{down=true;mov=false;sx=e.clientX;sy=e.clientY;const r=b.getBoundingClientRect();ox=r.left;oy=r.top;b.setPointerCapture(e.pointerId)});
b.addEventListener("pointermove",e=>{if(!down)return;const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)+Math.abs(dy)>8)mov=true;if(mov){b.style.left=Math.max(0,Math.min(innerWidth-80,ox+dx))+"px";b.style.top=Math.max(0,Math.min(innerHeight-80,oy+dy))+"px";b.style.right="auto"}});
b.addEventListener("pointerup",()=>{down=false;if(mov)return;const n=Date.now();if(n-lt<350){lt=0;abrirAvatar()}else{lt=n;setTimeout(()=>{if(lt&&Date.now()-lt>=340){lt=0;$("panel").classList.toggle("open")}},360)}})})();

const tm=LS.get("tema");if(tm)document.documentElement.dataset.theme=tm;
$("bWake").classList.toggle("on",wake);
if(LS.get("pin"))$("lock").style.display="flex";
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
