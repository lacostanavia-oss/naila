<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="naila-cara.webp">
<title>Naila · Asistente Personal</title>
<style>
:root{--bg:#030712;--panel:#0b1329;--cy:#22d3ee;--pu:#a855f7;--glow:rgba(34,211,238,.35);--tx:#f8fafc;--tx2:#94a3b8;--bd:rgba(34,211,238,.3);--user:#111e38;--ok:#34d399;--err:#f43f5e;--on:#030712;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f1f5f9;--panel:#fff;--cy:#0e7490;--pu:#7e22ce;--glow:rgba(14,116,144,.25);--tx:#0f172a;--tx2:#475569;--bd:rgba(14,116,144,.3);--user:#e0f2fe;--ok:#047857;--err:#b91c1c;--on:#fff}}
:root[data-theme="light"]{--bg:#f1f5f9;--panel:#fff;--cy:#0e7490;--pu:#7e22ce;--glow:rgba(14,116,144,.25);--tx:#0f172a;--tx2:#475569;--bd:rgba(14,116,144,.3);--user:#e0f2fe;--ok:#047857;--err:#b91c1c;--on:#fff}}
*{box-sizing:border-box;margin:0;padding:0;font-family:Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);display:flex;flex-direction:column;overflow:hidden}
header{position:relative;background:var(--panel);padding:14px 60px;text-align:center;border-bottom:1px solid var(--bd)}
header h1{font-size:1.25rem;color:var(--cy);letter-spacing:4px;font-weight:800}
header p{font-size:.75rem;color:var(--tx2);margin-top:2px}
#panel{display:none;position:absolute;z-index:10;top:100%;right:8px;left:8px;max-width:380px;max-height:72vh;overflow-y:auto;margin-left:auto;background:var(--panel);border:1px solid var(--bd);border-radius:14px;padding:14px;font-size:.82rem;color:var(--tx2);text-align:left;box-shadow:0 16px 40px rgba(0,0,0,.5)}
#panel.open{display:block}
#panel p{margin-bottom:6px}#panel b{color:var(--tx)}
#mem{margin:8px 0;max-height:110px;overflow-y:auto;font-size:.75rem;border:1px solid var(--bd);padding:6px;border-radius:8px}
.gb{border:1px solid var(--bd);border-radius:10px;padding:8px;margin:8px 0;font-size:.78rem}
.gb b{color:var(--cy)}
.pb{background:var(--bg);border-radius:999px;height:8px;overflow:hidden;margin-top:4px;border:1px solid var(--bd)}
.pf{background:linear-gradient(90deg,var(--cy),var(--ok));height:100%;width:0;transition:width .4s}
#panel button{background:none;border:1px solid var(--bd);color:var(--cy);border-radius:8px;padding:7px 10px;font-size:.75rem;margin:3px 4px 0 0;cursor:pointer}
main{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px;max-width:720px;width:100%;margin:0 auto}
.msg{padding:12px 16px;border-radius:16px;max-width:94%;font-size:.92rem;line-height:1.5;border:1px solid var(--bd);animation:in .25s ease;overflow-wrap:anywhere}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.msg.a{background:var(--panel);align-self:flex-start;border-bottom-left-radius:4px}
.msg.u{background:var(--user);color:var(--cy);align-self:flex-end;border-bottom-right-radius:4px}
.msg ul{padding-left:20px;margin-top:6px}.tag{color:var(--cy);font-weight:800;letter-spacing:.5px}
.msg small{display:block;margin-top:8px;color:var(--tx2);font-size:.75rem;border-top:1px dashed var(--bd);padding-top:4px}
.code{background:#010409;border:1px solid var(--cy);border-radius:10px;padding:12px;margin-top:10px;font-family:monospace;font-size:.82rem;color:#38bdf8;overflow-x:auto;white-space:pre-wrap}
footer{background:var(--panel);border-top:1px solid var(--bd);padding:10px 14px;max-width:720px;width:100%;margin:0 auto}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
.chip{flex:none;background:transparent;color:var(--cy);border:1px solid var(--bd);border-radius:999px;padding:7px 14px;font-size:.78rem;cursor:pointer;white-space:nowrap;font-weight:600}
.chip:active{background:var(--cy);color:var(--on)}
.row{display:flex;gap:10px;align-items:flex-end}
textarea{flex:1;resize:none;background:var(--bg);border:1px solid var(--bd);border-radius:14px;color:var(--tx);padding:12px 14px;font-size:.95rem;max-height:120px}
textarea:focus{outline:none;border-color:var(--cy);box-shadow:0 0 10px var(--glow)}
.btn{min-width:46px;height:46px;border-radius:14px;border:1px solid var(--bd);background:var(--bg);color:var(--cy);cursor:pointer;font-size:1.1rem;display:flex;align-items:center;justify-content:center}
.btn.on{background:var(--cy);color:var(--on)}
.btn.send{background:linear-gradient(135deg,var(--cy),var(--pu));color:#fff;border:0;padding:0 16px;font-weight:700;font-size:.88rem}
#lock{position:fixed;inset:0;z-index:99;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px}
#lock input{background:var(--panel);border:1px solid var(--bd);color:var(--tx);border-radius:12px;padding:12px;font-size:1.1rem;text-align:center;width:200px}

/* SILUETA DE LA CHICA FLOTANTE (ESTILO NEÓN) */
#bubbleBtn{
  position:fixed; z-index:20; top:calc(env(safe-area-inset-top,0px) + 8px); right:10px;
  width:105px; height:105px; padding:0; border-radius:50%;
  border:2px solid var(--cy); background:radial-gradient(circle, rgba(11,19,41,0.98), rgba(3,7,18,1));
  box-shadow:0 0 18px var(--cy), inset 0 0 10px var(--cy);
  cursor:grab; touch-action:none; display:flex; align-items:center; justify-content:center;
  animation:flota 3.5s ease-in-out infinite, neonPulse 2s infinite alternate;
}
@keyframes neonPulse{
  from{ box-shadow:0 0 10px var(--cy), inset 0 0 5px var(--cy); }
  to{ box-shadow:0 0 24px var(--cy), inset 0 0 14px var(--cy); }
}
@keyframes flota{50%{transform:translateY(-4px)}}

.silueta-chica{
  width:90%; height:90%; display:flex; flex-direction:column; align-items:center; justify-content:center;
  position:relative; pointer-events:none;
}
.s-cabeza{
  width:36px; height:40px; border:2px solid var(--cy); border-radius:50% 50% 40% 40%;
  position:relative; box-shadow:0 0 8px var(--cy); background:rgba(34,211,238,0.06);
}
.s-ojos{
  position:absolute; top:15px; width:100%; display:flex; justify-content:space-around; padding:0 5px;
}
.s-ojo{
  width:5px; height:2px; background:var(--cy); border-radius:50%; box-shadow:0 0 6px var(--cy);
  transition:transform .1s;
}
.guino .s-ojo:nth-child(2){ transform:scaleY(0.2); }
.s-boca{
  position:absolute; bottom:7px; left:50%; transform:translateX(-50%);
  width:10px; height:3px; border:2px solid var(--pu); border-top:none; border-radius:0 0 6px 6px;
  box-shadow:0 0 6px var(--pu); transition:height .1s, width .1s;
}
.pal .s-boca{ height:6px; width:12px; background:rgba(168,85,247,0.3); }
.s-cuerpo{
  width:56px; height:28px; border:2px solid var(--cy); border-top:none; border-radius:0 0 28px 28px;
  margin-top:-2px; box-shadow:0 0 8px var(--cy); background:rgba(34,211,238,0.06);
}

#bubbleBtn.hablando{ border-color:var(--pu); box-shadow:0 0 25px var(--pu); }
#bubbleBtn.est-escucha{ border-color:var(--ok); box-shadow:0 0 0 3px var(--ok), 0 0 20px var(--ok); }
#bubbleBtn.est-alerta{ border-color:var(--err); box-shadow:0 0 22px var(--err); }

#avOv{position:fixed;inset:0;z-index:50;background:rgba(3,7,18,.94);display:none;flex-direction:column;align-items:center;justify-content:center;touch-action:none}
#avOv.open{display:flex}
#avWrap{position:relative;width:min(86vw,58vh);aspect-ratio:1; border:3px solid var(--cy); border-radius:50%; background:radial-gradient(circle, #0b1329, #030712); box-shadow:0 0 40px var(--cy); display:flex; align-items:center; justify-content:center; }
#avCap{color:var(--tx);font-size:.9rem;text-align:center;padding:12px 20px;min-height:56px;max-width:420px}
#avX{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);right:12px}
</style>
</head>
<body>
<div id="lock"><h1 style="color:var(--cy)">NAILA</h1><p style="color:var(--tx2)">Solo el dueño puede entrar</p><input id="pinIn" type="password" inputmode="numeric" placeholder="PIN"><button class="btn send" id="pinOk" style="height:42px">Entrar</button></div>
<header>
<h1>NAILA</h1><p>Asistente personal · Multiprofesional</p>
<button id="bubbleBtn" aria-label="Naila: toca para el panel, doble toque para el avatar">
  <div class="silueta-chica">
    <div class="s-cabeza">
      <div class="s-ojos"><div class="s-ojo"></div><div class="s-ojo"></div></div>
      <div class="s-boca"></div>
    </div>
    <div class="s-cuerpo"></div>
  </div>
</button>
<div id="panel">
<p><b>Rol:</b> <span id="rol">Mentora de Élite</span></p>
<p><b>Red:</b> <span id="net">…</span></p>
<div class="gb"><b>📊 Control gerencial</b><p id="stats" style="margin:4px 0 0"></p><div class="pb"><div class="pf" id="pf"></div></div><small id="cuello" style="display:block;margin-top:4px"></small></div>
<div id="mem"></div>
<button id="bAvatar">🧍 Avatar</button>
<button id="bPensar">💭 Pensamiento libre</button>
<button id="bCaja">💰 Caja</button>
<button id="bProy">📁 Proyecto</button>
<button id="bResumen">📊 Resumen</button>
<button id="bWake">🗣️ Palabra «Naila»</button>
<button id="bMute">🔊 Voz</button>
<button id="bMp3">🎙️ MP3</button>
<button id="bImg">🖼️ Galería</button>
<button id="bExp">📥 Exportar</button>
<button id="bCrypt">🔒 Cifrar respaldo</button>
<button id="bPin">🔑 PIN</button>
<button id="bCode">💻 Código</button>
<button id="bTema">🌓 Tema</button>
<button id="bClear">🗑️ Purgar</button>
</div>
</header>
<main id="chat" aria-live="polite"></main>
<footer>
<div class="chips" id="chips"></div>
<div class="row">
<textarea id="inp" rows="1" placeholder="Escribe o habla: gasté 20 en comida, recuérdame en 10 minutos…"></textarea>
<button class="btn" id="mic" aria-label="Escuchar continuamente">🎤</button>
<button class="btn send" id="send">Ejecutar</button>
</div>
<input type="file" id="fMp3" accept="audio/*" hidden>
<input type="file" id="fImg" accept="image/*" multiple hidden>
</footer>
<div id="avOv">
  <button class="btn" id="avX" aria-label="Cerrar">✕</button>
  <div id="avWrap">
    <div class="silueta-chica" style="width:60%; height:60%;">
      <div class="s-cabeza" style="width:80px; height:90px;">
        <div class="s-ojos" style="top:35px;"><div class="s-ojo" style="width:12px; height:5px;"></div><div class="s-ojo" style="width:12px; height:5px;"></div></div>
        <div class="s-boca" style="width:22px; height:7px; bottom:14px;"></div>
      </div>
      <div class="s-cuerpo" style="width:115px; height:60px;"></div>
    </div>
  </div>
  <div id="avCap"></div>
</div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm=s=>s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
const li=a=>"<ul>"+a.map(x=>"<li>"+x+"</li>").join("")+"</ul>";
const NOTA="<small>Naila opera con lealtad absoluta y enfoque total en tus metas de riqueza.</small>";
const LS={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
let db=null,memoria=[],caja=[],proyectos=[],notas=[],vozOn=true,mp3URL=null,rec=null,escuchando=false,wake=LS.get("wake")==="1";
const saldo=()=>caja.reduce((a,t)=>t.tipo==="ingreso"?a+t.monto:a-t.monto,0);

/* ---------- BASE DE DATOS ---------- */
const STORES=["kernel","caja","proyectos","notas"];
function initDB(){
  let req;
  try{req=indexedDB.open("NailaGerenciaDB",11)}catch(e){addMsg("⚠️ Este navegador no permite memoria local.","a");return}
  req.onerror=()=>addMsg("⚠️ No pude abrir la memoria local.","a");
  req.onupgradeneeded=e=>{const d=e.target.result;STORES.forEach(s=>{if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:"id",autoIncrement:true})})};
  req.onsuccess=e=>{db=e.target.result;sync().then(saludar)};
}
const all=n=>new Promise(r=>{db.transaction(n).objectStore(n).getAll().onsuccess=e=>r(e.target.result)});
const wr=(n,o,op="add")=>new Promise(r=>{const t=db.transaction(n,"readwrite");t.objectStore(n)[op](o);t.oncomplete=r;t.onerror=r});
async function sync(){if(!db)return;[memoria,caja,proyectos,notas]=await Promise.all(STORES.map(all));render()}

/* ---------- PANEL ---------- */
function render(){
  $("stats").textContent=`Caja neta: $${saldo().toFixed(2)} | Proyectos: ${proyectos.length}`;
  const ok=proyectos.filter(p=>p.estado==="completado").length;
  $("pf").style.width=(proyectos.length?Math.round(ok/proyectos.length*100):0)+"%";
  const pend=proyectos.filter(p=>p.estado!=="completado");
  $("cuello").textContent="Cuello de botella: "+(pend[0]?pend[0].nombre:"ninguno");
  $("cuello").style.color=pend[0]?"var(--err)":"var(--ok)";
  const m=$("mem");m.innerHTML="";
  const items=[...proyectos.map(p=>`• ${p.estado==="completado"?"✅":"🔹"} ${p.nombre}`),...notas.filter(n=>!n.hecho).map(n=>`• ${n.tipo==="rec"?"⏰":"📝"} ${n.texto}`)];
  if(!items.length)m.textContent="Sin proyectos ni notas.";
  items.forEach(t=>{const d=document.createElement("div");d.textContent=t;m.appendChild(d)});
}
function verRed(){const s=$("net");s.textContent=navigator.onLine?"Conectado":"Sin conexión (modo seguro)";s.style.color=navigator.onLine?"var(--ok)":"var(--cy)"}
addEventListener("online",verRed);addEventListener("offline",verRed);

/* ---------- CHAT Y VOZ ---------- */
function addMsg(h,t){const d=document.createElement("div");d.className="msg "+t;d.innerHTML=h;$("chat").appendChild(d);$("chat").scrollTop=$("chat").scrollHeight}
function hablar(h){
  if(!vozOn)return;
  const txt=String(h).replace(/<small>.*?<\/small>/g,"").replace(/<[^>]+>/g," ").replace(/&[a-z]+;/g," ").replace(/\s+/g," ").trim().slice(0,260);
  const b=$("bubbleBtn");
  if(mp3URL){const a=new Audio(mp3URL);b.classList.add("hablando");a.onended=a.onerror=()=>b.classList.remove("hablando");a.play().catch(()=>b.classList.remove("hablando"));return}
  if(!("speechSynthesis" in window)||!txt)return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(txt);u.lang="es-ES";
  let iv=null;const fin=()=>{clearInterval(iv);b.classList.remove("hablando");estado(base())};b.classList.add("hablando");u.onstart=()=>{iv=setInterval(palabra,300)};u.onboundary=palabra;u.onend=u.onerror=fin;
  speechSynthesis.speak(u);
}
function responder(h){addMsg(h,"a");estado(emocion(h));hablar(h)}

function setMic(){$("mic").classList.toggle("on",escuchando);estado(base())}
function escuchar(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){responder("Tu navegador no tiene reconocimiento de voz. En Android usa Chrome.");return}
  if(escuchando){escuchando=false;try{rec.stop()}catch(e){}setMic();return}
  rec=new SR();rec.lang="es-ES";rec.continuous=true;rec.interimResults=false;
  rec.onresult=e=>{
    for(let i=e.resultIndex;i<e.results.length;i++){
      if(!e.results[i].isFinal)continue;
      let t=e.results[i][0].transcript.trim();
      if(("speechSynthesis" in window)&&speechSynthesis.speaking)continue;
      if(wake){if(!norm(t).includes("naila"))continue;t=t.replace(/naila[,.:]?\s*/i,"")}
      if(t)enviar(t);
    }
  };
  rec.onerror=e=>{if(e.error==="not-allowed"||e.error==="service-not-allowed"){escuchando=false;setMic();addMsg("Permite el micrófono para usar tu voz.","a")}};
  rec.onend=()=>{if(escuchando)setTimeout(()=>{try{rec.start()}catch(e){}},300);else setMic()};
  escuchando=true;setMic();
  try{rec.start()}catch(e){escuchando=false;setMic()}
}

/* ---------- COMANDOS ESTRICTOS Y PENSAMIENTO EXPANSIVO ---------- */
const monto=n=>{const m=n.match(/(\d+(?:[.,]\d+)?)/);return m?parseFloat(m[1].replace(",",".")):NaN};
async function comando(t){
  const n=norm(t);let m;
  if(/(^| )(gaste|gasto|pague|compre)( |$)/.test(n)&&!isNaN(monto(n))){const v=monto(n);await wr("caja",{tipo:"gasto",monto:v,nota:t,fecha:new Date().toLocaleString("es")});await sync();return `<span class=tag>CAJA</span> Gasto de $${v.toFixed(2)} registrado. Caja neta: $${saldo().toFixed(2)}.`}
  if(/(ingreso|cobre|gane|recibi|vendi)/.test(n)&&!isNaN(monto(n))){const v=monto(n);await wr("caja",{tipo:"ingreso",monto:v,nota:t,fecha:new Date().toLocaleString("es")});await sync();return `<span class=tag>CAJA</span> Ingreso de $${v.toFixed(2)} registrado. Caja neta: $${saldo().toFixed(2)}.`}
  if(/(cuanto tengo|saldo|resumen|como voy)/.test(n))return resumen();
  
  if(m=n.match(/^nuevo proyecto\s+(.+)/)){const nom=t.replace(/^nuevo proyecto\s+/i,"").trim();await wr("proyectos",{nombre:nom,ingresos:0,estado:"activo"});await sync();return `<span class=tag>PROYECTO</span> Creé el proyecto <b>${esc(nom)}</b>.`}
  
  if(m=n.match(/(?:completa|termina|termine|finaliza)\w*\s+(?:el\s+)?(?:proyecto\s+)?(.+)/)){const p=proyectos.find(x=>norm(x.nombre).includes(m[1].trim()));if(p){p.estado="completado";await wr("proyectos",p,"put");await sync();return `<span class=tag>PROYECTO</span> ${esc(p.nombre)} marcado como completado. 🎯`}return "No encontré ese proyecto."}
  if(m=n.match(/recuerdame en (\d+)\s*(minuto|hora|segundo)\w*\s*(.*)/)){const k={segundo:1e3,minuto:6e4,hora:36e5}[m[2]],txt=m[3]||"Recordatorio";await wr("notas",{tipo:"rec",texto:txt,due:Date.now()+m[1]*k,hecho:false});await sync();if("Notification" in window&&Notification.permission==="default")Notification.requestPermission();return `<span class=tag>RECORDATORIO</span> Te aviso en ${m[1]} ${m[2]}(s): ${esc(txt)}. Debe estar abierta la app.`}
  if(m=n.match(/^(?:anota|nota|meta|apunta)\w*\s+(.+)/)){const txt=t.replace(/^\S+\s+/,"");await wr("notas",{tipo:"meta",texto:txt,hecho:false});await sync();return `<span class=tag>MEMORIA</span> Guardado: ${esc(txt)}.`}
  if(/(que recuerdas|mis metas|mis notas|que tengo pendiente)/.test(n)){const a=notas.filter(x=>!x.hecho);return `<span class=tag>MEMORIA</span> `+(a.length?li(a.map(x=>esc(x.texto))):"No tienes notas ni metas pendientes.")}
  if(/(que hora|que dia)/.test(n))return `Son las ${new Date().toLocaleTimeString("es",{hour:"2-digit",minute:"2-digit"})} del ${new Date().toLocaleDateString("es",{weekday:"long",day:"numeric",month:"long"})}.`;
  if(/(modo zen|relaj|respira)/.test(n))return `<span class=tag>MODO ZEN</span> Inhala 4 segundos, sostén 4, exhala 6. Repite 5 veces. Después elige una sola tarea.`
  if(/(silencio|callate|mutea)/.test(n)){vozOn=false;$("bMute").textContent="🔇 Mute";return "Voz desactivada."}
  if(/(cambia.*tema|modo oscuro|modo claro)/.test(n)){tema();return "Tema cambiado."}
  return null;
}
function resumen(){
  const pend=proyectos.filter(p=>p.estado!=="completado").length,rec=notas.filter(x=>!x.hecho&&x.tipo==="rec").length;
  return `<span class=tag>RESUMEN DE RIQUEZA</span>`+li([`Caja neta actual: <b>$${saldo().toFixed(2)}</b> (Meta: 10,000–15,000 BRL)`,`Proyectos activos: <b>${pend}</b> de ${proyectos.length}`,`Recordatorios pendientes: <b>${rec}</b>`]);
}

/* ---------- MÓDULOS DE ÉLITE Y GENERACIÓN EXPANSIVA DE IDEAS ---------- */
const MODS=[
{rol:"Mentora de Élite",kw:["explicar","explicame","entender","que es","como funciona","duda","aprender"],run:q=>`<b>[Tutoría Estratégica]</b> Analizando <i>"${esc(q)}"</i> con enfoque en escalabilidad:`+li(["<b>Visión global:</b> Rompemos el concepto en piezas sencillas.","<b>Aplicación práctica:</b> Rentabilizando cada hora invertida.","<b>Acción directa:</b> ¿Cómo lo ejecutamos hoy mismo?"])},

function pintaCodigo(){return `<div class=code>&lt;!DOCTYPE html&gt;\n&lt;html&gt;\n&lt;head&gt;&lt;title&gt;App&lt;/title&gt;&lt;/head&gt;\n&lt;body&gt;\n  &lt;h1&gt;Naila Core&lt;/h1&gt;\n  &lt;script&gt;console.log("Sistema autónomo activo");&lt;/script&gt;\n&lt;/body&gt;\n&lt;/html&gt;</div>`}
function detectar(t){const n=norm(t);let best=null,mx=0;for(const m of MODS){const s=m.kw.filter(k=>n.includes(k)).length;if(s>mx){mx=s;best=m}}return best}
const AYUDA="<span class=tag>NAILA · DIRECTORA</span> Estoy contigo para guiarte a la riqueza. Puedo ayudarte con:"+li(["<b>Caja:</b> «gasté 20 en comida», «cobré 150»","<b>Proyectos:</b> «nuevo proyecto tienda», «completa proyecto tienda»","<b>Memoria:</b> «anota llamar al banco», «qué recuerdas»","<b>Estrategia y Negocios:</b> Pregúntame sobre modelos de ingresos, crecimiento en redes o expansión."]);

async function enviar(forzado){
  const t=(forzado??$("inp").value).trim();if(!t)return;
  $("inp").value="";$("inp").style.height="auto";
  addMsg(esc(t),"u");
  if(!db){responder("La memoria local aún está cargando, un momento.");return}
  
  const h=await comando(t);
  if(h){
    $("rol").textContent="Asistente";
    await wr("kernel",{fecha:new Date().toLocaleString("es"),texto:t,modulo:"comando"});
    return responder(h);
  }
  
  const m=detectar(t);
  $("rol").textContent=m?m.rol:"Mentora de Élite";
  await wr("kernel",{fecha:new Date().toLocaleString("es"),texto:t,modulo:m?m.rol:"general"});
  
  let respuestaFinal = m ? (typeof m.run === 'function' ? m.run(t) : m.run) : null;
  if(!respuestaFinal){
    const ideasMaestras = [
      `Analizando tu consulta sobre <i>"${esc(t)}"</i> desde la perspectiva de escalar tus ingresos en Brasil: Para pasar de la base actual a la meta alta, debemos empaquetar tu conocimiento o servicio en una oferta irresistible que se venda por volumen y automatización. ¿Qué obstáculo técnico o mental te impide lanzarlo hoy?`,
      `Respecto a <i>"${esc(t)}"</i>, tu enfoque debe ser implacable: eliminar lo que no genera caja neta y duplicar esfuerzos en lo que ya demostró tracción. Vamos a estructurar un plan de acción de 48 horas sin excusas.`,
      `Evaluando <i>"${esc(t)}"</i> con mentalidad de directora ejecutiva: Toda idea de negocio vale cero si la ejecución falla. Diseñemos una validación rápida en el mercado brasileño con costo cero de inversión inicial.`
    ];
    respuestaFinal = `<span class=tag>PENSAMIENTO EXPANSIVO</span>` + ideasMaestras[Math.floor(Math.random() * ideasMaestras.length)];
  }
  responder(respuestaFinal + NOTA);
}

/* ---------- AUTONOMÍA: PENSAMIENTO LIBRE Y AVISOS ---------- */
function pensar(){
  const o=[],pend=proyectos.filter(p=>p.estado!=="completado"),s=saldo();
  if(s<0)o.push(`Tu caja está en negativo ($${s.toFixed(2)}). Orden financiero inmediato requerido.`);
  if(pend.length>2)o.push(`Tienes ${pend.length} frentes abiertos. Cierra <b>${esc(pend[0].nombre)}</b> antes de dispersar energía.`);
  if(pend.length===1)o.push(`Tu prioridad absoluta es <b>${esc(pend[0].nombre)}</b>. Exígite avanzar hoy.`);
  if(!proyectos.length)o.push("No hay proyectos activos registrados. Crea uno y ponle fecha de ejecución.");
  if(!o.length)o.push("Estructura sólida detectada. Es momento de escalar la facturación y buscar nuevas fuentes de ingresos.");
  responder(`<span class=tag>AUDITORÍA DE DISCIPLINA</span>`+li(o)+"<small>Analizado bajo estándares de alta gerencia.</small>");
}
function saludar(){
  const p=proyectos.filter(x=>x.estado!=="completado").length;
  addMsg(`<span class=tag>NAILA ACTIVA</span> Lista. Caja actual: $${saldo().toFixed(2)} · Proyectos: ${p}. Mi misión es tu éxito financiero. Háblame o dime qué estrategia ejecutamos hoy.`,"a");
}
async function vigilar(){
  if(!db)return;
  for(const n of notas){
    if(n.tipo==="rec"&&!n.hecho&&n.due<=Date.now()){
      n.hecho=true;await wr("notas",n,"put");
      const h=`<span class=tag>⏰ ALERTA DE AGENDA</span> ${esc(n.texto)}`;responder(h);
      try{if("Notification" in window&&Notification.permission==="granted")new Notification("Naila",{body:n.texto})}catch(e){}
      await sync();
    }
  }
}
setInterval(vigilar,15000);

/* ---------- SEGURIDAD: PIN Y CIFRADO ---------- */
const enc=new TextEncoder();
async function sha(s){const b=await crypto.subtle.digest("SHA-256",enc.encode("naila:"+s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
function revisarPin(){if(LS.get("pin")){$("lock").style.display="flex"}}
$("pinOk").onclick=async()=>{if(await sha($("pinIn").value)===LS.get("pin")){$("lock").style.display="none";$("pinIn").value=""}else{$("pinIn").value="";$("pinIn").placeholder="Incorrecto"}};
$("bPin").onclick=async()=>{const p=prompt(LS.get("pin")?"Nuevo PIN (vacío para quitarlo):":"Crea un PIN numérico:");if(p===null)return;if(p===""){try{localStorage.removeItem("pin")}catch(e){}responder("PIN eliminado.");return}LS.set("pin",await sha(p));responder("PIN guardado. Se pedirá al abrir Naila.")};
const b64=a=>{let s="";a.forEach(c=>s+=String.fromCharCode(c));return btoa(s)};
function bajar(nombre,txt,tipo){const u=URL.createObjectURL(new Blob([txt],{type:tipo}));const a=document.createElement("a");a.href=u;a.download=nombre;a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)}
function datos(){return JSON.stringify({kernel:memoria,caja,proyectos,notas,fecha:new Date().toISOString()},null,2)}
async function cifrar(){
  const pw=prompt("Contraseña para cifrar el respaldo (no se puede recuperar):");if(!pw)return;
  const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
  const km=await crypto.subtle.importKey("raw",enc.encode(pw),"PBKDF2",false,["deriveKey"]);
  const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:200000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["encrypt"]);
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv},k,enc.encode(datos())));
  bajar("Naila_Respaldo_Cifrado.json",JSON.stringify({s:b64(salt),iv:b64(iv),d:b64(ct)}),"application/json");
  responder("Respaldo cifrado con AES-256 generado.");
}

const TG=()=>[$("bubbleBtn"),$("avWrap")];let tEst=null;
const base=()=>escuchando?"escucha":"idle";

function emocion(h){const n=norm(String(h).replace(/<[^>]+>/g," "));if(/(fraude|estafa|negativo|riesgo|no pude|no encontre)/.test(n))return"alerta";if(/(completado|registrado|ingreso|guardado|cree |conectada)/.test(n))return"feliz";if(/(zen|respira|inhala)/.test(n))return"calma";return"idle"}

(function(){const b=$("bubbleBtn");let sx,sy,ox,oy,mov=false,down=false,lt=0;
b.addEventListener("pointerdown",e=>{down=true;mov=false;sx=e.clientX;sy=e.clientY;const r=b.getBoundingClientRect();ox=r.left;oy=r.top;b.setPointerCapture(e.pointerId)});
b.addEventListener("pointermove",e=>{if(!down)return;const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)+Math.abs(dy)>8)mov=true;if(mov){b.style.left=Math.max(0,Math.min(innerWidth-105,ox+dx))+"px";b.style.top=Math.max(0,Math.min(innerHeight-105,oy+dy))+"px";b.style.right="auto"}});
b.addEventListener("pointerup",()=>{down=false;if(mov)return;const n=Date.now();if(n-lt<350){lt=0;$("avOv").classList.add("open");decir("¿Qué estrategia analizamos hoy?");}else{lt=n;setTimeout(()=>{if(lt&&Date.now()-lt>=340){lt=0;$("panel").classList.toggle("open")}},360)}});})();
