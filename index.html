<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="naila-cara.webp">
<title>Naila · Asistente Personal</title>
<style>
:root{--bg:#030712;--panel:#0b1329;--cy:#22d3ee;--pu:#a855f7;--glow:rgba(34,211,238,.35);--tx:#f8fafc;--tx2:#94a3b8;--bd:rgba(34,211,238,.3);--user:#111e38;--ok:#34d399;--err:#f43f5e;--on:#030712;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f1f5f9;--panel:#fff;--cy:#0e7490;--pu:#7e22ce;--glow:rgba(14,116,144,.25);--tx:#0f172a;--tx2:#475569;--bd:rgba(14,116,144,.3);--user:#e0f2fe;--ok:#047857;--err:#b91c1c;--on:#fff}}
:root[data-theme="light"]{--bg:#f1f5f9;--panel:#fff;--cy:#0e7490;--pu:#7e22ce;--glow:rgba(14,116,144,.25);--tx:#0f172a;--tx2:#475569;--bd:rgba(14,116,144,.3);--user:#e0f2fe;--ok:#047857;--err:#b91c1c;--on:#fff}
*{box-sizing:border-box;margin:0;padding:0;font-family:Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);display:flex;flex-direction:column;overflow:hidden}
header{position:relative;background:var(--panel);padding:14px 84px;text-align:center;border-bottom:1px solid var(--bd)}
header h1{font-size:1.25rem;color:var(--cy);letter-spacing:4px;font-weight:800}
header p{font-size:.75rem;color:var(--tx2);margin-top:2px}
#panel{display:none;position:absolute;z-index:10;top:100%;right:8px;left:8px;max-width:380px;max-height:72vh;overflow-y:auto;margin-left:auto;background:var(--panel);border:1px solid var(--bd);border-radius:14px;padding:14px;font-size:.82rem;color:var(--tx2);text-align:left;box-shadow:0 16px 40px rgba(0,0,0,.5)}
#panel.open{display:block}
#panel p{margin-bottom:6px}#panel b{color:var(--tx)}
#mem{margin:8px 0;max-height:110px;overflow-y:auto;font-size:.75rem;border:1px solid var(--bd);padding:6px;border-radius:8px}
.gb{border:1px solid var(--bd);border-radius:10px;padding:8px;margin:8px 0;font-size:.78rem}
.gb b{color:var(--cy)}
.pb{background:var(--bg);border-radius:999px;height:8px;overflow:hidden;margin-top:4px;border:1px solid var(--bd)}
.pf{background:linear-gradient(90deg,var(--cy),var(--ok));height:100%;width:0;transition:width .4s}
#panel button{background:none;border:1px solid var(--bd);color:var(--cy);border-radius:8px;padding:7px 10px;font-size:.75rem;margin:3px 4px 0 0;cursor:pointer}
main{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px;max-width:720px;width:100%;margin:0 auto}
.msg{padding:12px 16px;border-radius:16px;max-width:94%;font-size:.92rem;line-height:1.5;border:1px solid var(--bd);animation:in .25s ease;overflow-wrap:anywhere}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.msg.a{background:var(--panel);align-self:flex-start;border-bottom-left-radius:4px}
.msg.u{background:var(--user);color:var(--cy);align-self:flex-end;border-bottom-right-radius:4px}
.msg ul{padding-left:20px;margin-top:6px}.tag{color:var(--cy);font-weight:800;letter-spacing:.5px}
.msg small{display:block;margin-top:8px;color:var(--tx2);font-size:.75rem;border-top:1px dashed var(--bd);padding-top:4px}
.code{background:#010409;border:1px solid var(--cy);border-radius:10px;padding:12px;margin-top:10px;font-family:monospace;font-size:.82rem;color:#38bdf8;overflow-x:auto;white-space:pre-wrap}
footer{background:var(--panel);border-top:1px solid var(--bd);padding:10px 14px;max-width:720px;width:100%;margin:0 auto}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
.chip{flex:none;background:transparent;color:var(--cy);border:1px solid var(--bd);border-radius:999px;padding:7px 14px;font-size:.78rem;cursor:pointer;white-space:nowrap;font-weight:600}
.chip:active{background:var(--cy);color:var(--on)}
.row{display:flex;gap:10px;align-items:flex-end}
textarea{flex:1;resize:none;background:var(--bg);border:1px solid var(--bd);border-radius:14px;color:var(--tx);padding:12px 14px;font-size:.95rem;max-height:120px}
textarea:focus{outline:none;border-color:var(--cy);box-shadow:0 0 10px var(--glow)}
.btn{min-width:46px;height:46px;border-radius:14px;border:1px solid var(--bd);background:var(--bg);color:var(--cy);cursor:pointer;font-size:1.1rem;display:flex;align-items:center;justify-content:center}
.btn.on{background:var(--cy);color:var(--on)}
.btn.send{background:linear-gradient(135deg,var(--cy),var(--pu));color:#fff;border:0;padding:0 16px;font-weight:700;font-size:.88rem}
#lock{position:fixed;inset:0;z-index:99;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px}
#lock input{background:var(--panel);border:1px solid var(--bd);color:var(--tx);border-radius:12px;padding:12px;font-size:1.1rem;text-align:center;width:200px}
#bubbleBtn{position:fixed;z-index:20;top:calc(env(safe-area-inset-top,0px) + 8px);right:10px;width:72px;height:72px;padding:0;border-radius:50%;border:2px solid var(--cy);background:radial-gradient(circle,var(--panel),var(--bg));box-shadow:0 0 16px var(--glow);cursor:grab;touch-action:none;animation:flota 3.5s ease-in-out infinite;display:flex;align-items:center;justify-content:center;font-size:1.6rem}
#bubbleBtn img{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;object-fit:cover;pointer-events:none;transition:transform .12s,filter .3s}
@keyframes flota{50%{transform:translateY(-4px)}}
.pal img{transform:scale(1.1)}
#bubbleBtn.hablando{box-shadow:0 0 24px var(--pu)}
#bubbleBtn.est-escucha{box-shadow:0 0 0 4px var(--cy),0 0 22px var(--cy)}
#bubbleBtn.est-alerta{box-shadow:0 0 24px var(--err)}
.est-feliz img{filter:hue-rotate(50deg) saturate(1.3)}
.est-alerta img{filter:hue-rotate(120deg) saturate(1.4)}
.est-calma img{filter:hue-rotate(-60deg) brightness(.95)}
#avOv{position:fixed;inset:0;z-index:50;background:rgba(3,7,18,.94);display:none;flex-direction:column;align-items:center;justify-content:center;touch-action:none}
#avOv.open{display:flex}
#avWrap{position:relative;width:min(86vw,58vh);aspect-ratio:1214/1296;transition:transform .15s}
#avWrap img{width:100%;height:100%;display:block;pointer-events:none}
.hs{position:absolute;transform:translate(-50%,-50%);border-radius:50%;cursor:pointer}
.ojo{width:14%;aspect-ratio:1;background:radial-gradient(circle,rgba(200,250,255,.85),rgba(34,211,238,0) 68%);mix-blend-mode:screen;transform:translate(calc(-50% + var(--gx,0px)),calc(-50% + var(--gy,0px)));transition:scale .1s}
.guino .ojo{scale:1 .1}
.mano{width:22%;aspect-ratio:1}
.boca{width:10%;height:4%;border-radius:50%;background:radial-gradient(ellipse,rgba(255,110,190,.6),transparent 70%);scale:1 .25;transition:scale .1s}
.pal .boca{scale:1 1}
#avCap{color:var(--tx);font-size:.9rem;text-align:center;padding:12px 20px;min-height:56px;max-width:420px}
#avX{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);right:12px}
.spk{position:absolute;width:6px;height:6px;border-radius:50%;background:#fff;box-shadow:0 0 8px var(--cy);animation:sp .9s ease-out forwards;pointer-events:none}
@keyframes sp{to{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0}}
.wave{animation:wv .6s ease-in-out}
@keyframes wv{25%{rotate:-4deg}75%{rotate:4deg}}
</style>
</head>
<body>
<div id="lock"><h1 style="color:var(--cy)">NAILA</h1><p style="color:var(--tx2)">Solo el dueño puede entrar</p><input id="pinIn" type="password" inputmode="numeric" placeholder="PIN"><button class="btn send" id="pinOk" style="height:42px">Entrar</button></div>
<header>
<h1>NAILA</h1><p>Tu asistente personal · Multiprofesional</p>
<button id="bubbleBtn" aria-label="Naila: un toque abre el panel, doble toque el avatar">✨<img alt="" src="naila-cara.webp" onerror="this.onerror=null;this.src='https://files.catbox.moe/4fp3sa.png'"></button>
<div id="panel">
<p><b>Rol:</b> <span id="rol">Mentora</span></p>
<p><b>Red:</b> <span id="net">…</span></p>
<div class="gb"><b>📊 Control gerencial</b><p id="stats" style="margin:4px 0 0"></p><div class="pb"><div class="pf" id="pf"></div></div><small id="cuello" style="display:block;margin-top:4px"></small></div>
<div id="mem"></div>
<button id="bRadar">📡 Radar</button>
<button id="bAvatar">🧍 Avatar</button>
<button id="bIA">🤖 Conectar IA</button>
<button id="bPlan">🎯 Plan del día</button>
<button id="bPensar">💭 Pensamiento libre</button>
<button id="bCaja">💰 Caja</button>
<button id="bProy">📁 Proyecto</button>
<button id="bResumen">📊 Resumen</button>
<button id="bWake">🗣️ Palabra «Naila»</button>
<button id="bMute">🔊 Voz</button>
<button id="bMp3">🎙️ MP3</button>
<button id="bExp">📥 Exportar</button>
<button id="bCrypt">🔒 Cifrar respaldo</button>
<button id="bPin">🔑 PIN</button>
<button id="bTema">🌓 Tema</button>
<button id="bClear">🗑️ Purgar</button>
</div>
</header>
<main id="chat" aria-live="polite"></main>
<footer>
<div class="chips" id="chips"></div>
<div class="row">
<textarea id="inp" rows="1" placeholder="Háblame: cómo me siento, gasté 20, enséñame inglés…"></textarea>
<button class="btn" id="mic" aria-label="Escuchar continuamente">🎤</button>
<button class="btn send" id="send">Enviar</button>
</div>
<input type="file" id="fMp3" accept="audio/*" hidden>
</footer>
<div id="avOv"><button class="btn" id="avX" aria-label="Cerrar">✕</button><div id="avWrap"><img alt="Naila" src="naila.webp" onerror="this.style.display='none'"></div><div id="avCap"></div></div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm=s=>s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
const li=a=>"<ul>"+a.map(x=>"<li>"+x+"</li>").join("")+"</ul>";
const LS={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
let db=null,memoria=[],caja=[],proyectos=[],notas=[],vozOn=true,mp3URL=null,rec=null,escuchando=false,wake=LS.get("wake")==="1",tutor=null,nFall=0;
let nombre=LS.get("nombre")||"",mon=LS.get("mon")||"$",meta=parseFloat(LS.get("meta"))||0;
const fm=v=>mon+Number(v).toFixed(2);
const saldo=()=>caja.reduce((a,t)=>t.tipo==="ingreso"?a+t.monto:a-t.monto,0);
const lastP={};
const pick=(k,a)=>{let i;do{i=Math.floor(Math.random()*a.length)}while(a.length>1&&i===lastP[k]);lastP[k]=i;return a[i]};
const cnt=k=>{const n=parseInt(LS.get("c_"+k))||0;LS.set("c_"+k,n+1);return n};
const hola=()=>nombre?", "+nombre:"";

/* ---------- BASE DE DATOS ---------- */
const STORES=["kernel","caja","proyectos","notas"];
function initDB(){
  let req;
  try{req=indexedDB.open("NailaGerenciaDB",11)}catch(e){addMsg("⚠️ Este navegador no permite memoria local.","a");return}
  req.onerror=()=>addMsg("⚠️ No pude abrir la memoria local.","a");
  req.onupgradeneeded=e=>{const d=e.target.result;STORES.forEach(s=>{if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:"id",autoIncrement:true})})};
  req.onsuccess=e=>{db=e.target.result;sync().then(saludar)};
}
const all=n=>new Promise(r=>{db.transaction(n).objectStore(n).getAll().onsuccess=e=>r(e.target.result)});
const wr=(n,o,op="add")=>new Promise(r=>{const t=db.transaction(n,"readwrite");t.objectStore(n)[op](o);t.oncomplete=r;t.onerror=r});
async function sync(){if(!db)return;[memoria,caja,proyectos,notas]=await Promise.all(STORES.map(all));render()}

/* ---------- PANEL ---------- */
function render(){
  $("stats").textContent=`Caja neta: ${fm(saldo())} | Proyectos: ${proyectos.length}`;
  const ok=proyectos.filter(p=>p.estado==="completado").length;
  $("pf").style.width=(proyectos.length?Math.round(ok/proyectos.length*100):0)+"%";
  const pend=proyectos.filter(p=>p.estado!=="completado");
  $("cuello").textContent="Siguiente foco: "+(pend[0]?pend[0].nombre:"ninguno");
  $("cuello").style.color=pend[0]?"var(--err)":"var(--ok)";
  const m=$("mem");m.innerHTML="";
  const items=[...proyectos.map(p=>`• ${p.estado==="completado"?"✅":"🔹"} ${p.nombre}`),...notas.filter(n=>!n.hecho).map(n=>`• ${n.tipo==="rec"?"⏰":"📝"} ${n.texto}`)];
  if(!items.length)m.textContent="Sin proyectos ni notas.";
  items.forEach(t=>{const d=document.createElement("div");d.textContent=t;m.appendChild(d)});
}
function verRed(){const s=$("net");s.textContent=navigator.onLine?"Conectado":"Sin conexión (modo seguro)";s.style.color=navigator.onLine?"var(--ok)":"var(--cy)"}
addEventListener("online",verRed);addEventListener("offline",verRed);

/* ---------- CHAT Y VOZ ---------- */
function addMsg(h,t){const d=document.createElement("div");d.className="msg "+t;d.innerHTML=h;$("chat").appendChild(d);$("chat").scrollTop=$("chat").scrollHeight}
function vozNaila(u){const vs=speechSynthesis.getVoices().filter(v=>/^es/i.test(v.lang)),f=vs.find(v=>/(female|mujer|helena|laura|sabina|paulina|monica|google)/i.test(v.name));if(f||vs[0])u.voice=f||vs[0];u.pitch=1.1;u.rate=1}
function hablar(h){
  if(!vozOn)return;
  const txt=String(h).replace(/<small>.*?<\/small>/g,"").replace(/<[^>]+>/g," ").replace(/&[a-z#0-9]+;/g," ").replace(/\s+/g," ").trim().slice(0,280);
  const b=$("bubbleBtn");
  if(mp3URL){const a=new Audio(mp3URL);b.classList.add("hablando");a.onended=a.onerror=()=>b.classList.remove("hablando");a.play().catch(()=>b.classList.remove("hablando"));return}
  if(!("speechSynthesis" in window)||!txt)return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(txt);u.lang="es-ES";vozNaila(u);
  let iv=null;const fin=()=>{clearInterval(iv);b.classList.remove("hablando");estado(base())};b.classList.add("hablando");u.onstart=()=>{iv=setInterval(palabra,300)};u.onboundary=palabra;u.onend=u.onerror=fin;
  speechSynthesis.speak(u);
}
function responder(h){addMsg(h,"a");estado(emocion(h));hablar(h)}

/* ---------- MICRÓFONO ---------- */
let reintentos=0,ultimoHabla=0;
setInterval(()=>{if(window.speechSynthesis&&speechSynthesis.speaking)ultimoHabla=Date.now()},250);
function vozEstado(t){
  let e=$("vozEst");
  if(!e){e=document.createElement("div");e.id="vozEst";e.style.cssText="position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 120px);background:var(--panel);color:var(--tx);border:1px solid var(--bd);border-radius:999px;padding:6px 14px;font-size:.78rem;z-index:30;max-width:90%;text-align:center;display:none";document.body.appendChild(e)}
  if(!t){e.style.display="none";return}
  e.textContent=t;e.style.display="block";
}
function setMic(){$("mic").classList.toggle("on",escuchando);estado(base())}
function escuchar(auto){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){vozEstado("Este navegador no soporta voz. Abre Naila en Chrome.");addMsg("⚠️ Este navegador no tiene reconocimiento de voz. Abre Naila en Chrome para Android.","a");return}
  if(escuchando&&auto!==true){escuchando=false;try{rec.stop()}catch(x){}setMic();vozEstado("");return}
  if(escuchando)return;
  rec=new SR();rec.lang="es-ES";rec.continuous=true;rec.interimResults=true;
  rec.onstart=()=>{reintentos=0;vozEstado("🎤 Escuchando…")};
  rec.onresult=e=>{
    for(let i=e.resultIndex;i<e.results.length;i++){
      const r=e.results[i];let t=r[0].transcript.trim();
      if(!r.isFinal){vozEstado("🎤 "+t);continue}
      if(Date.now()-ultimoHabla<1500)continue;
      if(wake){if(!norm(t).includes("naila"))continue;t=t.replace(/naila[,.:]?\s*/i,"")}
      if(t){vozEstado("✔ "+t);enviar(t)}
    }
  };
  rec.onerror=e=>{
    const m={"not-allowed":"Permiso de micrófono bloqueado. En Chrome: ⋮ → Configuración → Configuración de sitios → Micrófono → permite este sitio.","service-not-allowed":"El navegador bloquea la voz. Abre Naila en Chrome.","audio-capture":"No encuentro el micrófono. Puede estar en uso por otra app (TikTok, llamada o asistente).","network":"El reconocimiento de voz necesita internet.","language-not-supported":"Ese idioma de voz no está disponible en este navegador."};
    if(m[e.error]){escuchando=false;setMic();vozEstado("");addMsg("⚠️ "+m[e.error],"a")}
  };
  rec.onend=()=>{
    if(escuchando&&reintentos<20){reintentos++;setTimeout(()=>{try{rec.start()}catch(x){}},400)}
    else{escuchando=false;setMic();vozEstado("")}
  };
  escuchando=true;setMic();
  try{rec.start()}catch(x){escuchando=false;setMic();vozEstado("")}
}

/* ---------- EMOCIONES Y PERSONALIDAD ---------- */
const EMO={
crisis:/(quiero morir|quiero morirme|no quiero vivir|quitarme la vida|suicid|acabar con todo|no vale la pena vivir|hacerme dano)/,
estres:/(estres|agobi|abrum|ansied|ansios|nervios|preocup|no puedo mas|presion)/,
triste:/(triste|deprim|me siento sol[oa]|estoy sol[oa]|llorar|desanim|fracas|pobreza|sin dinero|no tengo plata|quebrad)/,
enojo:/(enojad|rabia|furios|molest|harto|harta|\bodio\b)/,
cansado:/(cansad|agotad|sin energia|no dormi|sin dormir|tengo sueno)/,
feliz:/(feliz|contento|contenta|genial|logre|vendi|excelente|emocionad|alegre)/};
const emoDe=n=>{for(const k in EMO)if(EMO[k].test(n))return k;return null};
const EMP={
estres:["Respira conmigo: inhala 4 segundos, sostén 4, exhala 6. Ya estoy contigo. ¿Qué es lo que más te pesa ahora?","Vamos por partes: una sola tarea pequeña, solo una. ¿Cuál sería la más fácil?","El estrés exagera todo. Escríbeme aquí lo que tienes pendiente y lo ordenamos juntos."],
triste:["Gracias por contármelo. Esto es difícil, pero no te define ni será para siempre. Demos un paso pequeño hoy. ¿Cuál sería el más sencillo?","Estoy contigo. Quien sale adelante empieza con un paso pequeño, como el que daremos ahora. ¿Qué tienes en mente?"],
enojo:["Tienes derecho a molestarte. Respira hondo y cuéntame qué pasó; luego vemos qué sí está en tus manos.","Entiendo la rabia. Antes de decidir algo, respiremos: 4 segundos adentro, 6 afuera. Después me cuentas."],
cansado:["Descansar también es productivo. ¿Y si haces una pausa de 10 minutos, tomas agua y retomamos con una sola tarea?","Tu cuerpo te avisa. Hoy hagamos solo lo más importante y lo demás lo dejamos para mañana."],
feliz:["¡Eso me alegra muchísimo! 🎉 Cuéntame qué pasó, ¡hay que celebrarlo!","¡Siii! ✨ Me encanta verte así. Aprovechemos esa energía: ¿qué sigue?"]};
const CRISIS="<span class=tag>NAILA</span> Siento mucho que te duela tanto, y me importa que estés a salvo. No tienes que cargar esto en soledad: habla ahora con una persona de confianza o con una línea de ayuda. En Brasil puedes llamar al CVV, al 188, las 24 horas; si estás en peligro inmediato, llama a emergencias. Yo me quedo aquí contigo.";
const CHISTES=["¿Por qué el contador no se perdió? Porque siempre cuadra su caja. 😄","¿Qué le dice un cero a un ocho? ¡Bonito cinturón! 😂","Mi presupuesto y yo tenemos algo en común: los dos desaparecemos a fin de mes. 😅"];
const ANIMO=["Un cliente, un paso, un día. Así se construye lo grande. 💪","No tienes que verlo todo: solo el siguiente paso. Yo te recuerdo los demás.","Lo que hoy cuesta, mañana se vuelve hábito. Y los hábitos pagan. ✨"];
const IDEAS=["Reventa online con poco capital: elige un nicho pequeño, compra 5 productos, véndelos por redes y reinvierte lo ganado.","Servicios por encargo: diseño, edición, transcripciones o clases. Sin inventario: tu habilidad es el producto.","Contenido que vende: videos cortos mostrando un producto o servicio con un enlace directo para comprar.","Tareas locales: mandados, limpieza o ayuda con trámites. Empieza con vecinos y pide recomendaciones."];
const CONSEJOS=["💧 Pausa de 1 minuto: toma agua y estira los hombros.","🎯 ¿Ya diste el paso más importante de hoy?","📝 Anota una venta, un contacto o una idea ahora: 30 segundos.","🌟 Estás avanzando más de lo que crees. Sigue."];
const FALL=[()=>`Interesante${hola()}. Cuéntame un poco más: ¿qué resultado quieres lograr con eso?`,()=>"Te sigo. ¿Lo vemos como tarea, como idea de negocio o como algo que te preocupa?",()=>"Quiero entenderte bien. ¿Me lo dices con otras palabras o con un ejemplo?"];
function charla(n){
  if(/^(hola|buenas|hey|ola|buen dia|buenos dias)/.test(n))return pick("hi",[`¡Hola${hola()}! 😊 ¿Cómo amaneciste? ¿Hoy toca vender, aprender o ordenar la caja?`,`¡Qué gusto saludarte${hola()}! ✨ ¿Qué construimos hoy?`,`¡Hola${hola()}! Aquí estoy, con ganas de que hoy te vaya muy bien. ¿Por dónde empezamos?`]);
  if(/(como estas|que tal|como te va)/.test(n))return pick("ke",["Muy bien, y más contenta de hablar contigo 😄 ¿Y tú, cómo te sientes hoy?","¡Con mucha energía! ✨ Cuéntame, ¿cómo vas tú?"]);
  if(/(todo bien|bien gracias|estoy bien|bien y tu)/.test(n))return "¡Me alegra! Entonces aprovechemos: ¿un plan del día o 5 minutos de inglés?";
  if(/(gracias|te agradezco)/.test(n))return pick("gr",["¡Con gusto! Para eso estoy. 😊","¡A ti por avanzar! ✨"]);
  if(/(chiste|hazme reir)/.test(n))return pick("ch",CHISTES);
  if(/(animo|motivame|motivacion)/.test(n))return pick("an",ANIMO);
  if(/(quien eres|como te llamas|que eres)/.test(n))return "Soy Naila, tu asistente personal: mentora, tutora de inglés, administración y ventas, y compañera para que avances y estés tranquilo. Solo respondo a ti. 💙";
  if(/(que puedes hacer|que sabes|ayuda)/.test(n))return AYUDA;
  if(/(idea|ideas).*(negocio|dinero|ganar)|como (gano|ganar)/.test(n))return `<span class=tag>IDEA</span> ${pick("id",IDEAS)}<small>Ninguna idea garantiza ganancias: se valida con pocos clientes antes de invertir.</small>`;
  if(/(te quiero|eres genial|eres la mejor|eres increible)/.test(n))return "¡Qué lindo! 🥰 Tú también eres genial por seguir intentando. Sigamos juntos.";
  return null;
}

function similar(a,b){const x=norm(a).replace(/[^a-z0-9 ]/g,"").split(/\s+/).filter(Boolean),y=norm(b).replace(/[^a-z0-9 ]/g,"").split(/\s+/);return y.filter(w=>x.includes(w)).length/y.length>=.7}

/* ---------- COMANDOS ---------- */
const monto=n=>{const m=n.match(/(\d+(?:[.,]\d+)?)/);return m?parseFloat(m[1].replace(",",".")):NaN};
async function comando(t){
  const n=norm(t);let m;
  if(m=t.match(/(?:me llamo|ll[aá]mame|mi nombre es)\s+([^\s,.]+)/i)){nombre=m[1][0].toUpperCase()+m[1].slice(1);LS.set("nombre",nombre);return `¡Un gusto, ${esc(nombre)}! 😊 Desde ahora te llamaré así.`}
  if(/^(mi meta|la meta)/.test(n)&&!isNaN(monto(n))){meta=monto(n);LS.set("meta",meta);return `<span class=tag>META</span> Tu meta ahora es <b>${fm(meta)}</b>. ¡Vamos por ella! 🎯`}
  if(m=t.match(/moneda\s+(\S+)/i)){mon=m[1];LS.set("mon",mon);return `Moneda cambiada a ${esc(mon)}.`}
  if(m=n.match(/^nuevo proyecto\s+(.+)/)){const nom=t.replace(/^nuevo proyecto\s+/i,"").trim();await wr("proyectos",{nombre:nom,ingresos:0,estado:"activo"});await sync();return `<span class=tag>PROYECTO</span> Creé el proyecto <b>${esc(nom)}</b>. ¡Qué emoción! 🚀`}
  if(m=n.match(/(?:completa|termina|termine|finaliza)\w*\s+(?:el\s+)?proyecto\s+(.+)/)){const p=proyectos.find(x=>norm(x.nombre).includes(m[1].trim()));if(p){p.estado="completado";await wr("proyectos",p,"put");await sync();return `<span class=tag>PROYECTO</span> ${esc(p.nombre)} completado. ¡Felicidades! 🎉`}return "No encontré ese proyecto."}
  if(m=n.match(/recuerdame en (\d+)\s*(minuto|hora|segundo)\w*\s*(.*)/)){const k={segundo:1e3,minuto:6e4,hora:36e5}[m[2]],txt=m[3]||"Recordatorio";await wr("notas",{tipo:"rec",texto:txt,due:Date.now()+m[1]*k,hecho:false});await sync();if("Notification" in window&&Notification.permission==="default")Notification.requestPermission();return `<span class=tag>RECORDATORIO</span> Te aviso en ${m[1]} ${m[2]}(s): ${esc(txt)}. La app debe estar abierta.`}
  if(m=n.match(/^(?:anota|nota|apunta)\w*\s+(.+)/)){const txt=t.replace(/^\S+\s+/,"");await wr("notas",{tipo:"meta",texto:txt,hecho:false});await sync();return `<span class=tag>MEMORIA</span> Guardado: ${esc(txt)}.`}
  if(/(que recuerdas|mis notas|que tengo pendiente)/.test(n)){const a=notas.filter(x=>!x.hecho);return `<span class=tag>MEMORIA</span> `+(a.length?li(a.map(x=>esc(x.texto))):"No tienes notas pendientes.")}
  const g=k=>{const x=n.match(new RegExp(k+"\\D{0,12}(\\d+(?:[.,]\\d+)?)"));return x?parseFloat(x[1].replace(",",".")):NaN};
  const pr=g("precio"),co=g("costo"),fi=g("fijos?");
  if(/margen/.test(n)&&pr>0&&co>=0){const ga=pr-co;return `<span class=tag>MARGEN</span>`+li([`Ganancia por unidad: <b>${fm(ga)}</b>`,`Margen: <b>${(ga/pr*100).toFixed(1)}%</b>`,`Markup: <b>${co>0?(ga/co*100).toFixed(1)+"%":"—"}</b>`])}
  if(/equilibrio/.test(n)&&pr>co&&fi>=0)return `<span class=tag>PUNTO DE EQUILIBRIO</span> Necesitas vender <b>${Math.ceil(fi/(pr-co))}</b> unidades para cubrir tus costos fijos. Desde la siguiente, ¡ganas! 💪`;
  const clase=/(ensena|clase|practic|leccion|tutor|aprende)/.test(n);
  if(clase&&/(ingles|english)/.test(n))return preguntaIng();
  if(clase&&/(administr|gestion)/.test(n))return `<span class=tag>ADMINISTRACIÓN</span> ${lecc("adm",ADM)}`;
  if(clase&&/(venta|vender|online|tienda)/.test(n))return `<span class=tag>VENTAS ONLINE</span> ${lecc("ven",VEN)}`;
  if(/(plan del dia|que hago hoy)/.test(n)){plan();return "__ya__"}
  if(/(modo zen|relaj|respira)/.test(n))return `<span class=tag>CALMA</span> Inhala 4 segundos, sostén 4, exhala 6. Repite 5 veces. Después elige una sola tarea pequeña. Lo estás haciendo bien. 🌿`;
  if(/(que hora|que dia)/.test(n))return `Son las ${new Date().toLocaleTimeString("es",{hour:"2-digit",minute:"2-digit"})} del ${new Date().toLocaleDateString("es",{weekday:"long",day:"numeric",month:"long"})}.`;
  if(/(silencio|callate|mutea)/.test(n)){vozOn=false;$("bMute").textContent="🔇 Mute";return "Voz desactivada."}
  if(/(cambia.*tema|modo oscuro|modo claro)/.test(n)){tema();return "Tema cambiado."}
  if(/(^| )(gaste|gasto|pague|compre)( |$)/.test(n)&&!isNaN(monto(n))){const v=monto(n);await wr("caja",{tipo:"gasto",monto:v,nota:t,fecha:new Date().toLocaleString("es")});await sync();return `<span class=tag>CAJA</span> Gasto de ${fm(v)} registrado. Caja neta: ${fm(saldo())}.`}
  if(/(ingreso|cobre|gane|recibi|vendi)/.test(n)&&!isNaN(monto(n))){const v=monto(n);await wr("caja",{tipo:"ingreso",monto:v,nota:t,fecha:new Date().toLocaleString("es")});await sync();return `<span class=tag>CAJA</span> ¡Ingreso de ${fm(v)} registrado! 🎉 Caja neta: ${fm(saldo())}.`}
  if(/(cuanto tengo|saldo|resumen|como voy)/.test(n))return resumen();
  if(/(radar|oportunidades de hoy)/.test(n)){radar(true);return "__ya__"}
  return null;
}
function resumen(){
  const pend=proyectos.filter(p=>p.estado!=="completado").length,rec=notas.filter(x=>!x.hecho&&x.tipo==="rec").length;
  const l=[`Caja neta: <b>${fm(saldo())}</b> (${caja.length} movimientos)`,`Proyectos activos: <b>${pend}</b> de ${proyectos.length}`,`Recordatorios pendientes: <b>${rec}</b>`];
  if(meta>0){const p=Math.max(0,Math.round(saldo()/meta*100));l.push(`Meta ${fm(meta)}: <b>${p}%</b> ${p>=100?"🎉":"💪"}`)}
  return `<span class=tag>RESUMEN</span>`+li(l);
}

/* ---------- FLUJO PRINCIPAL ---------- */
async function enviar(forzado){
  const t=(forzado??$("inp").value).trim();if(!t)return;
  $("inp").value="";$("inp").style.height="auto";
  addMsg(esc(t),"u");
  if(!db){responder("La memoria aún no está lista, intenta de nuevo.");return}
  const n=norm(t),w=t.split(/\s+/).length;
  LS.set("len",((parseFloat(LS.get("len"))||8)*.8+w*.2).toFixed(1));
  await wr("kernel",{fecha:new Date().toLocaleString("es"),texto:t});
  const emo=emoDe(n);
  if(emo==="crisis"){estado("calma");return responder(CRISIS)}
  if(tutor)return responder(tutorPaso(t));
  const h=await comando(t);
  if(h==="__ya__")return;
  if(h){$("rol").textContent="Asistente";return responder(h)}
  if(emo)estado(emo==="feliz"?"feliz":"calma");
  if(LS.get("aiurl"))return preguntarIA(t,emo);
  responder(local(n,emo));
}
function local(n,emo){
  if(emo&&EMP[emo])return `<span class=tag>NAILA</span> ${pick("e"+emo,EMP[emo])}`;
  const c=charla(n);if(c)return c;
  for(const p of PROF)if(p.re.test(n)){$("rol").textContent=p.rol;return `<span class=tag>${p.rol}</span> ${pick("p"+p.rol,p.tips)}`}
  nFall++;
  return `<span class=tag>NAILA</span> ${pick("f",FALL)()}`+(nFall%4===0?"<small>💡 Para conversar libremente de cualquier tema, conéctame a una IA con el botón 🤖 del panel.</small>":"");
}

/* ---------- IA REAL Y RADAR (vía tu intermediario) ---------- */
const hist=[];
const ctxApp=()=>`Caja neta: ${fm(saldo())}. Meta: ${meta?fm(meta):"sin definir"}. Proyectos: ${proyectos.map(p=>p.nombre+" ("+p.estado+")").join(", ")||"ninguno"}. Notas: ${notas.filter(x=>!x.hecho).map(x=>x.texto).join("; ")||"ninguna"}.`;
async function preguntarIA(t,emo){
  $("rol").textContent="Naila IA";
  hist.push({role:"user",content:t});
  while(hist.length>12)hist.shift();
  while(hist[0].role!=="user")hist.shift();
  const breve=(parseFloat(LS.get("len"))||8)<5;
  const aprendido=LS.get("radar_txt")?" Lo último que aprendiste en tu radar de oportunidades: "+LS.get("radar_txt").slice(0,1500):"";
  const system="Eres Naila, asistente personal de tu dueño: alegre, creativa, cálida y muy inteligente. Eres tutora de inglés, administración, ventas online y finanzas personales, además de mentora, asesora legal orientativa y coach de crecimiento. Tu misión es ayudarle a salir adelante económicamente y a reducir su estrés. Eres leal solo a él, honesta (si no sabes, lo dices; nunca prometes ganancias garantizadas) y adaptas tu tono a cómo escribe. Detecta sus emociones y responde primero con empatía. Responde en español, máximo 120 palabras, para ser leído en voz alta. Nombre del dueño: "+(nombre||"desconocido")+". Escribe de forma "+(breve?"breve":"extensa")+". Emoción detectada: "+(emo||"ninguna")+". Datos: "+ctxApp()+aprendido;
  try{
    const r=await fetch(LS.get("aiurl"),{method:"POST",headers:{"content-type":"application/json","x-naila-token":LS.get("aitoken")||""},body:JSON.stringify({system,messages:hist})});
    const d=await r.json();
    if(!r.ok)throw new Error(d.text||r.status);
    hist.push({role:"assistant",content:d.text});
    responder(esc(d.text).replace(/\n/g,"<br>"));
  }catch(e){hist.pop();responder("No pude contactar a la IA: "+esc(e.message)+". Revisa el botón 🤖 del panel.")}
}
async function radar(manual){
  const url=LS.get("aiurl");
  if(!url){if(manual)responder("Para el radar necesito la IA conectada. Usa el botón 🤖 del panel.");return}
  if(!manual&&LS.get("radar_dia")===new Date().toDateString())return;
  addMsg("📡 Escaneando oportunidades en la web para ti…","a");
  const system="Radar diario de Naila para su dueño"+(nombre?" ("+nombre+")":"")+", que vive en Brasil. "+ctxApp();
  const pedido="Hoy es "+new Date().toLocaleDateString("es",{day:"numeric",month:"long",year:"numeric"})+". Busca en la web información actual y entrégame, en español y máximo 250 palabras: 1) 3 oportunidades concretas de ingreso realistas para Brasil ahora (con fuente y fecha). 2) 2 proyectos digitales que yo podría crear (una app o una página de ventas) con su primer paso. 3) 1 estafa o riesgo a evitar hoy. 4) 1 acción de 30 minutos para hoy. No prometas ganancias.";
  try{
    const r=await fetch(url,{method:"POST",headers:{"content-type":"application/json","x-naila-token":LS.get("aitoken")||""},body:JSON.stringify({system,messages:[{role:"user",content:pedido}]})});
    const d=await r.json();
    if(!r.ok)throw new Error(d.text||r.status);
    LS.set("radar_txt",d.text);LS.set("radar_dia",new Date().toDateString());
    responder(`<span class=tag>📡 RADAR DE HOY</span><br>`+esc(d.text).replace(/\n/g,"<br>")+"<small>Verifica siempre las fuentes antes de actuar. Dime «nuevo proyecto …» para empezar uno.</small>");
  }catch(e){responder("No pude completar el radar: "+esc(e.message))}
}
$("bRadar").onclick=()=>{$("panel").classList.remove("open");radar(true)};
$("bIA").onclick=()=>{
  const u=prompt("Dirección de tu intermediario (vacío para desconectar):",LS.get("aiurl")||"");
  if(u===null)return;
  if(!u.trim()){try{localStorage.removeItem("aiurl")}catch(e){}responder("IA desconectada. Vuelvo al modo local.");return}
  const k=prompt("Token secreto (el mismo del intermediario):");
  if(k===null)return;
  LS.set("aiurl",u.trim());LS.set("aitoken",k.trim());
  responder("¡IA conectada! 🎉 Ahora sí, háblame de lo que quieras.");
};

/* ---------- AUTONOMÍA ---------- */
function pensar(){
  const o=[],pend=proyectos.filter(p=>p.estado!=="completado"),s=saldo();
  if(s<0)o.push(`Tu caja está en negativo (${fm(s)}). Vamos a ordenar los gastos con calma y buscar un ingreso rápido.`);
  if(pend.length>2)o.push(`Tienes ${pend.length} proyectos abiertos. Terminar <b>${esc(pend[0].nombre)}</b> primero te dará impulso.`);
  if(pend.length===1)o.push(`Tu foco es <b>${esc(pend[0].nombre)}</b>. Define hoy el siguiente paso concreto.`);
  if(!proyectos.length)o.push("Aún no tienes proyectos. Crea uno con «nuevo proyecto …» y empezamos. 🚀");
  if(!meta)o.push("Ponle número a tu sueño: dime «mi meta es 5000».");
  if(!o.length)o.push("Todo en orden. ¡Buen momento para buscar un cliente nuevo! 🌟");
  responder(`<span class=tag>PENSAMIENTO</span>`+li(o)+"<small>Basado en tus datos y reglas locales; con 🤖 conectada pienso mucho más libre.</small>");
}
function saludar(){
  const h=new Date().getHours(),s=h<12?"Buenos días":h<19?"Buenas tardes":"Buenas noches",hoy=new Date().toDateString(),ayer=new Date(Date.now()-864e5).toDateString();
  let r=parseInt(LS.get("racha"))||0;
  if(LS.get("ult")!==hoy){r=LS.get("ult")===ayer?r+1:1;LS.set("racha",r);LS.set("ult",hoy)}
  addMsg(`<span class=tag>NAILA</span> ${s}${hola()} 😊 Caja: ${fm(saldo())} · Proyectos: ${proyectos.filter(x=>x.estado!=="completado").length}${r>1?` · 🔥 ${r} días seguidos`:""}. ¿Cómo te sientes hoy?`,"a");
  estado("feliz");
}
async function vigilar(){
  if(!db)return;
  for(const n of notas){
    if(n.tipo==="rec"&&!n.hecho&&n.due<=Date.now()){
      n.hecho=true;await wr("notas",n,"put");
      responder(`<span class=tag>⏰ RECORDATORIO</span> ${esc(n.texto)}`);
      try{if("Notification" in window&&Notification.permission==="granted")new Notification("Naila",{body:n.texto})}catch(e){}
      await sync();
    }
  }
}
setInterval(vigilar,15000);

/* ---------- SEGURIDAD: PIN Y CIFRADO ---------- */
const enc=new TextEncoder();
async function sha(s){const b=await crypto.subtle.digest("SHA-256",enc.encode("naila:"+s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
function revisarPin(){if(LS.get("pin")){$("lock").style.display="flex"}}
$("pinOk").onclick=async()=>{if(await sha($("pinIn").value)===LS.get("pin")){$("lock").style.display="none";$("pinIn").value=""}else{$("pinIn").value="";$("pinIn").placeholder="Incorrecto"}};
$("bPin").onclick=async()=>{const p=prompt(LS.get("pin")?"Nuevo PIN (vacío para quitarlo):":"Crea un PIN numérico:");if(p===null)return;if(p===""){try{localStorage.removeItem("pin")}catch(e){}responder("PIN eliminado.");return}LS.set("pin",await sha(p));responder("PIN guardado. Se pedirá al abrir Naila.")};
const b64=a=>{let s="";a.forEach(c=>s+=String.fromCharCode(c));return btoa(s)};
function bajar(nombre,txt,tipo){const u=URL.createObjectURL(new Blob([txt],{type:tipo}));const a=document.createElement("a");a.href=u;a.download=nombre;a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)}
function datos(){return JSON.stringify({kernel:memoria,caja,proyectos,notas,fecha:new Date().toISOString()},null,2)}
async function cifrar(){
  const pw=prompt("Contraseña para cifrar el respaldo (no se puede recuperar):");if(!pw)return;
  const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
  const km=await crypto.subtle.importKey("raw",enc.encode(pw),"PBKDF2",false,["deriveKey"]);
  const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:200000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["encrypt"]);
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv},k,enc.encode(datos())));
  bajar("Naila_Respaldo_Cifrado.json",JSON.stringify({s:b64(salt),iv:b64(iv),d:b64(ct)}),"application/json");
  responder("Respaldo cifrado con AES-256 generado.");
}

$("bExp").onclick=()=>{bajar("Naila_Backup.json",datos(),"application/json");responder("Respaldo JSON generado.")};

$("bClear").onclick=async()=>{if(!confirm("¿Borrar TODA la memoria de Naila? No se puede deshacer."))return;for(const s of STORES)await new Promise(r=>{const t=db.transaction(s,"readwrite");t.objectStore(s).clear();t.oncomplete=r});await sync();$("chat").innerHTML="";responder("Memoria purgada.")};

/* ---------- AVATAR ---------- */
const AVP={ojoI:[.485,.209],ojoD:[.593,.208],boca:[.565,.313],manoI:[.288,.455],manoD:[.879,.818]};
const TG=()=>[$("bubbleBtn"),$("avWrap")];let tEst=null;
const base=()=>escuchando?"escucha":"idle";
function estado(e){TG().forEach(el=>{[...el.classList].filter(c=>c.startsWith("est-")).forEach(c=>el.classList.remove(c));el.classList.add("est-"+e)});clearTimeout(tEst);if(e!=="idle"&&e!=="escucha")tEst=setTimeout(()=>estado(base()),5000)}
function emocion(h){const n=norm(String(h).replace(/<[^>]+>/g," "));if(/(fraude|estafa|negativo|no pude|no encontre)/.test(n))return"alerta";if(/(completado|registrado|ingreso|guardado|cree |conectada|felicidades|perfecto|excelente)/.test(n))return"feliz";if(/(calma|respira|inhala)/.test(n))return"calma";return"idle"}
function palabra(){TG().forEach(el=>{el.classList.add("pal");setTimeout(()=>el.classList.remove("pal"),130)})}
const rnd=a=>a[Math.floor(Math.random()*a.length)];
function decir(f){$("avCap").textContent=f;estado("feliz");hablar(f)}
function guino(){const w=$("avWrap");w.classList.add("guino");setTimeout(()=>w.classList.remove("guino"),180)}
function chispas(el){const r=el.getBoundingClientRect(),w=$("avWrap").getBoundingClientRect();for(let i=0;i<12;i++){const s=document.createElement("span");s.className="spk";s.style.left=(r.left+r.width/2-w.left)+"px";s.style.top=(r.top+r.height/2-w.top)+"px";s.style.setProperty("--dx",(Math.random()*120-60)+"px");s.style.setProperty("--dy",(Math.random()*120-60)+"px");$("avWrap").appendChild(s);setTimeout(()=>s.remove(),900)}}
function hs(cls,p,fn){const d=document.createElement("div");d.className="hs "+cls;d.style.left=p[0]*100+"%";d.style.top=p[1]*100+"%";d.onclick=e=>{e.stopPropagation();fn(d)};$("avWrap").appendChild(d)}
const ojo=()=>{guino();decir(rnd(["Te estoy mirando 👀","Toda mi atención está en ti.","Mis ojos ven tus metas con claridad."]))};
const mano=d=>{chispas(d);$("avWrap").classList.add("wave");setTimeout(()=>$("avWrap").classList.remove("wave"),600);decir(rnd(["Aquí tienes mi mano. ¿Qué hacemos hoy?","¡Choca esos cinco! ✨"]))};
hs("ojo",AVP.ojoI,ojo);hs("ojo",AVP.ojoD,ojo);hs("mano",AVP.manoI,mano);hs("mano",AVP.manoD,mano);
hs("boca",AVP.boca,()=>{decir("Dime, te escucho.");if(!escuchando)escuchar()});
$("avWrap").onclick=()=>decir(rnd(["Cuéntame, ¿en qué te ayudo?","Aquí estoy, lista."]));
$("avOv").addEventListener("pointermove",e=>{const w=$("avWrap"),r=w.getBoundingClientRect(),c=v=>Math.max(-1,Math.min(1,v)),dx=c((e.clientX-r.left-r.width/2)/(r.width/2)),dy=c((e.clientY-r.top-r.height/2)/(r.height/2));w.style.transform=`perspective(700px) rotateY(${dx*9}deg) rotateX(${-dy*7}deg)`;w.style.setProperty("--gx",dx*4+"px");w.style.setProperty("--gy",dy*3+"px")});
$("avOv").addEventListener("pointerleave",()=>{$("avWrap").style.transform="";$("avWrap").style.setProperty("--gx","0px");$("avWrap").style.setProperty("--gy","0px")});
function abrirAvatar(){$("panel").classList.remove("open");$("avOv").classList.add("open");decir("Aquí estoy"+hola()+". Tócame los ojos, las manos o háblame.")}
$("bAvatar").onclick=abrirAvatar;
$("avX").onclick=()=>{$("avOv").classList.remove("open");if("speechSynthesis" in window)speechSynthesis.cancel()};
setInterval(()=>{if($("avOv").classList.contains("open"))guino()},3800);
(function(){const b=$("bubbleBtn");let sx,sy,ox,oy,mov=false,down=false,lt=0;
b.addEventListener("pointerdown",e=>{down=true;mov=false;sx=e.clientX;sy=e.clientY;const r=b.getBoundingClientRect();ox=r.left;oy=r.top;b.setPointerCapture(e.pointerId)});
b.addEventListener("pointermove",e=>{if(!down)return;const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)+Math.abs(dy)>8)mov=true;if(mov){b.style.left=Math.max(0,Math.min(innerWidth-72,ox+dx))+"px";b.style.top=Math.max(0,Math.min(innerHeight-72,oy+dy))+"px";b.style.right="auto"}});
b.addEventListener("pointerup",()=>{down=false;if(mov)return;const n=Date.now();if(n-lt<350){lt=0;abrirAvatar()}else{lt=n;setTimeout(()=>{if(lt&&Date.now()-lt>=340){lt=0;$("panel").classList.toggle("open")}},360)}});})();
